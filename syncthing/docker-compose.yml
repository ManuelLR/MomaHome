version: "2.4"
services:
    syncthing:
        container_name: syncthing
        hostname: woody-docker_syncthing
        image: syncthing/syncthing:2.1.7
        ports:
            - 0.0.0.0:8384:8384
            - 0.0.0.0:22000:22000
            - 0.0.0.0:21027:21027/udp
        volumes:
            # Config files
            - ./config:/var/syncthing/config
            # All data together
            - /data/syncthing-data:/var/syncthing
        environment:
            - TZ=Europe/Madrid
            # id $USER
            - PUID=1000
            - PGID=1000
            # Soft target for the Go heap: GC works harder past this. It does not
            # cover SQLite's own memory, hence well below mem_limit.
            - GOMEMLIMIT=768MiB
        # Hard cap so a DB scan/GC on a big folder can't push the whole host
        # (Home Assistant, AdGuard, Immich...) into swap. Observed peaks were
        # ~600-900 MiB with block indexing on; revisit after a few days.
        mem_limit: 1536m
        memswap_limit: 2g
        restart: unless-stopped
        # network_mode: "host"
