# Logwatch service for the off-site backup; install.sh copies it to
# /etc/logwatch/conf/services/. Shows the lines backup.sh logs with tag
# restic-o2. Logwatch adds --since/--until for the report range itself.

Title = "Off-site backup (restic -> O2 Cloud)"
LogFile = none
*JournalCtl = "--output=cat --identifier=restic-o2"
