# Logwatch service: summary of the off-site restic backup to O2 Cloud.
# Install as /etc/logwatch/conf/services/restic-o2.conf (see ../README.md).

Title = "Off-site backup (restic -> O2 Cloud)"

# Read the systemd journal of both units instead of a log file. Logwatch adds
# --since/--until for the report range itself.
LogFile =
*JournalCtl = "--output=cat --unit=restic-o2-backup.service --unit=restic-o2-prune.service"
