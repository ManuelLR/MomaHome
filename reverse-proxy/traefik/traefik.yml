## traefik.yml

global:
  checkNewVersion: True
  # sendAnonymousUsag: True

# log:
#   level: DEBUG

## Stdout, sent to CrowdSec by the syslog logging driver (docker-compose.yml)
accessLog: {}

entryPoints:
  web:
    address: ":80"
    ## Redirect all http to https
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      ## Every router on this entrypoint, see file-dynamic-conf/crowdsec.yaml
      middlewares:
        - crowdsec@file
    # http:
    #   maxHeaderBytes: 4194304
  dns-tls:
    address: ":853"


experimental:
  plugins:
    crowdsec-bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      # renovate: datasource=github-releases depName=maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.8.1

# Docker configuration backend
providers:
  docker:
    endpoint: "unix:///tmp/docker.sock"
    exposedbydefault: False
    # defaultRule: "Host(`{{ trimPrefix `/` .Name }}.docker.localhost`)"
    network: reverse-proxy
  file:
    directory: "/etc/traefik/file-dynamic-conf/"

metrics:
  prometheus:
    # Used by monitoring components
    addRoutersLabels: true
    entryPoint: traefik

# API and dashboard configuration
api:
  insecure: True
  # Access to http://192.168.200.7:8080/dashboard/
  dashboard: True

# Enable Let's Encrypt (wildcard/dns level)
certificatesResolvers:
  principal:
    acme:
      storage: /letsencrypt/acme.json
      ## Used as env variable
      # email: xyz@example.con
      ## With the next flag we indicate that we would like to generate the certificate with that root cert that is valid until "04 Jun 2035"
      preferredChain: 'ISRG Root X1'
      dnsChallenge:
        provider: desec
        delayBeforeCheck: 60s
  oldDomain:
    acme:
      storage: /letsencrypt/acme.json
      ## Used as env variable
      # email: xyz@example.con
      ## With the next flag we indicate that we would like to generate the certificate with that root cert that is valid until "04 Jun 2035"
      preferredChain: 'ISRG Root X1'
      dnsChallenge:
        provider: duckdns
