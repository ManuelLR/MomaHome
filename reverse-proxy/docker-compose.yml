version: "2.4"
services:
  traefik:
    image: traefik:v3.7.18
    container_name: reverse-proxy_traefik
    restart: always
    ports:
      - "192.168.200.7:8080:8080"
      - "192.168.200.7:80:80"
      - "192.168.200.7:443:443"
      - "192.168.200.7:853:853"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./traefik/letsencrypt/:/letsencrypt/
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/file-dynamic-conf/:/etc/traefik/file-dynamic-conf/:ro
    # Stdout (access log included) goes to CrowdSec over syslog. `docker logs`
    # keeps working through Docker's local cache, rotated by the cache-* options.
    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:5514"
        syslog-format: rfc5424micro
        tag: traefik
        cache-max-size: "50m"
        cache-max-file: "5"
    extra_hosts:
      - host.docker.internal:172.17.0.1
    networks:
      - net-reverse-proxy
    environment: 
      - TRAEFIK_CERTIFICATESRESOLVERS_PRINCIPAL_ACME_EMAIL=${TRAEFIK_CERTIFICATESRESOLVERS_PRINCIPAL_ACME_EMAIL:-example@abc.com}
      - TRAEFIK_CERTIFICATESRESOLVERS_OLDDOMAIN_ACME_EMAIL=${TRAEFIK_CERTIFICATESRESOLVERS_PRINCIPAL_ACME_EMAIL:-example@abc.com}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
      - DESEC_TOKEN=${DESEC_TOKEN}
      - DESEC_POLLING_INTERVAL=60
      - DESEC_PROPAGATION_TIMEOUT=660
        # Looks like desec is having problems creating CNAME entries used to validate wildcard certs
      - LEGO_DISABLE_CNAME_SUPPORT=true
      # Read by traefik/file-dynamic-conf/crowdsec.yaml
      - CROWDSEC_BOUNCER_KEY=${CROWDSEC_BOUNCER_KEY:?Define CROWDSEC_BOUNCER_KEY in .env}

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.2
    restart: unless-stopped
    # Image entrypoint plus busybox crond for the hub update every 12 h
    # (crowdsec/crontab). docker_start.sh still execs crowdsec as PID 1.
    entrypoint: ["/bin/bash", "-c", "crond -b -l 8 -c /etc/crontabs && exec /bin/bash /docker_start.sh"]
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Madrid
      # Hub upgrades only from crowdsec/crontab, never on start: a restart loop
      # must not hammer the hub (it can ban the IP). The index is only
      # re-downloaded on start when it is older than 24 h, and the cron keeps it
      # fresher than that.
      - NO_HUB_UPGRADE=true
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      - HA_CROWDSEC_WEBHOOK_URL=${HA_CROWDSEC_WEBHOOK_URL:?Define HA_CROWDSEC_WEBHOOK_URL in .env}
      # Registers the "traefik" bouncer with this key on first start
      - BOUNCER_KEY_traefik=${CROWDSEC_BOUNCER_KEY}
      # Registers (on every start) the machine crowdsec-ui logs in with
      - AGENT_USERNAME=crowdsec-web-ui
      - AGENT_PASSWORD=${CROWDSEC_UI_MACHINE_PASSWORD:?Define CROWDSEC_UI_MACHINE_PASSWORD in .env}
    ports:
      # Syslog from Docker's logging driver (Traefik)
      - "127.0.0.1:5514:5514/udp"
    volumes:
      - ${CROWDSEC_CONFIG_DIR:?Define CROWDSEC_CONFIG_DIR in .env}:/etc/crowdsec/
      - ${CROWDSEC_DATA_DIR:?Define CROWDSEC_DATA_DIR in .env}:/var/lib/crowdsec/data/
      - ./crowdsec/acquis.d/:/etc/crowdsec/acquis.d/:ro
      - ./crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      - ./crowdsec/notifications/http.yaml:/etc/crowdsec/notifications/http.yaml:ro
      - ./crowdsec/config.yaml.local:/etc/crowdsec/config.yaml.local:ro
      - ./crowdsec/console.yaml:/etc/crowdsec/console.yaml:ro
      - ./crowdsec/context.yaml:/etc/crowdsec/console/context.yaml:ro
      - ./crowdsec/crontab:/etc/crontabs/root:ro
    extra_hosts:
      - host.docker.internal:172.17.0.1
    networks:
      - net-reverse-proxy

  crowdsec-ui:
    # Web UI to review alerts and remove decisions. Logs in to LAPI as the
    # crowdsec-web-ui machine, registered by the crowdsec service.
    image: ghcr.io/theduffman85/crowdsec-web-ui:2026.11.11
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    # The entrypoint starts as root to chown /app/data, then drops to `node`
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    environment:
      - CONFIG_INSTANCE_LAPI_URL=http://crowdsec:8080
      - CONFIG_INSTANCE_LAPI_AUTH_USERNAME=crowdsec-web-ui
      - CONFIG_INSTANCE_LAPI_AUTH_PASSWORD=${CROWDSEC_UI_MACHINE_PASSWORD:?Define CROWDSEC_UI_MACHINE_PASSWORD in .env}
      # No calls to GitHub/ghcr.io for its own updates (Renovate handles them)
      - CONFIG_UPDATES_ENABLED=false
      - CONFIG_UI_TIME_ZONE=Europe/Madrid
      - CONFIG_UI_DATE_FORMAT=yyyy/mm/dd
      - CONFIG_UI_TIME_FORMAT=24h
    volumes:
      - ${CROWDSEC_UI_DATA_DIR:?Define CROWDSEC_UI_DATA_DIR in .env}:/app/data/
    depends_on:
      - crowdsec
    networks:
      - net-reverse-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.crowdsec-ui.loadbalancer.server.port=3000"
      - "traefik.http.routers.crowdsec-ui.rule=Host(`${CROWDSEC_UI_EXTERNAL_DOMAIN:?Define CROWDSEC_UI_EXTERNAL_DOMAIN in .env}`)"
      - "traefik.http.routers.crowdsec-ui.entrypoints=websecure"
      - "traefik.http.routers.crowdsec-ui.tls.certresolver=principal"
      - "traefik.http.routers.crowdsec-ui.tls.domains[0].sans=${EXTERNAL_WILDCARD_DOMAIN:?Define EXTERNAL_WILDCARD_DOMAIN in .env}"
      # PERMANENT LAN/WireGuard only. It can remove bans, so it must NEVER be
      # published, not even when the TEMPORARY global-lan-only is lifted: this
      # router uses its own middleware, not global-lan-only@file. Same ranges,
      # see traefik/file-dynamic-conf/lan-only.yaml for why each one is safe.
      - "traefik.http.middlewares.crowdsec-ui-lan-only.ipallowlist.sourcerange=192.168.200.0/24,172.16.0.0/12,10.13.13.0/24"
      - "traefik.http.routers.crowdsec-ui.middlewares=crowdsec-ui-lan-only"

networks:
  net-reverse-proxy:
    # Aims to create a network called "reverse-proxy" to reuse in others containers to be routed by reverse-proxy
    # This network must be created before start. `docker network create reverse-proxy`
    name: reverse-proxy
    external: true
