# Local bans to Home Assistant (packages/crowdsec)
type: http
name: http_home_assistant
log_level: info
max_retry: 3
timeout: 10s
format: |
  [{{ range $i, $a := . }}{{ if $i }},{{ end }}{{ $hosts := "[]" }}{{ $paths := "[]" }}{{ range $a.Meta }}{{ if eq .Key "target_host" }}{{ $hosts = .Value }}{{ end }}{{ if eq .Key "target_uri" }}{{ $paths = .Value }}{{ end }}{{ end }}{"scenario": {{ $a.Scenario | toJson }}, "ip": {{ $a.Source.Value | toJson }}, "country": {{ $a.Source.Cn | toJson }}, "as_name": {{ $a.Source.AsName | toJson }}, "events": {{ $a.EventsCount | toJson }}, "hosts": {{ $hosts }}, "paths": {{ $paths }}}{{ end }}]
url: ${HA_CROWDSEC_WEBHOOK_URL}
method: POST
headers:
  Content-Type: application/json
