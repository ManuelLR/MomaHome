version: "2.4"
services:
  galley:
    # Self-hosted web app. Source is the ./src submodule, built locally
    # (no published image).
    build: ./src
    restart: unless-stopped
    volumes:
      # Persistent app data (host path, like syncthing and samba).
      - /data/galley:/pb/pb_data
    networks:
      - reverse-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.galley.loadbalancer.server.port=8090"
      - "traefik.http.routers.galley.rule=Host(`${GALLEY_EXTERNAL_DOMAIN}`)"
      - "traefik.http.routers.galley.entrypoints=websecure"
      - "traefik.http.routers.galley.tls.certresolver=principal"
      - "traefik.http.routers.galley.tls.domains[0].sans=${EXTERNAL_WILDCARD_DOMAIN}"
      # LAN-only: reachable only from the home network.
      - "traefik.http.middlewares.galley-lan-only.ipallowlist.sourcerange=192.168.200.0/24"
      - "traefik.http.routers.galley.middlewares=galley-lan-only"

networks:
  reverse-proxy:
    # External network created by reverse-proxy setup
    external: true
