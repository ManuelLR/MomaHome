version: "2.4"
services:
  galley:
    # Self-hosted web app. Source is the ./src submodule, built locally
    # (no published image).
    build: ./src
    restart: unless-stopped
    volumes:
      # Persistent app data (host path, like syncthing and samba).
      - /data/galley:/pb/pb_data
    networks:
      - reverse-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.galley.loadbalancer.server.port=8090"
      - "traefik.http.routers.galley.rule=Host(`${GALLEY_EXTERNAL_DOMAIN}`)"
      - "traefik.http.routers.galley.entrypoints=websecure"
      - "traefik.http.routers.galley.tls.certresolver=principal"
      - "traefik.http.routers.galley.tls.domains[0].sans=${EXTERNAL_WILDCARD_DOMAIN}"
      # LAN-only: reachable only from the home network.
      - "traefik.http.middlewares.galley-lan-only.ipallowlist.sourcerange=192.168.200.0/24"
      # Allow embedding in an iframe from a short, explicit allow-list of origins
      # (e.g. galley itself + Home Assistant). PocketBase serves
      # `X-Frame-Options: SAMEORIGIN`, which only accepts DENY/SAMEORIGIN and
      # can't list several origins, so we drop it (empty value = delete) and use a
      # CSP `frame-ancestors` instead. GALLEY_FRAME_ANCESTORS holds the
      # space-separated origins and stays out of git via the .env file.
      - "traefik.http.middlewares.galley-embed.headers.customResponseHeaders.X-Frame-Options="
      - "traefik.http.middlewares.galley-embed.headers.contentSecurityPolicy=frame-ancestors ${GALLEY_FRAME_ANCESTORS}"
      - "traefik.http.routers.galley.middlewares=galley-lan-only,galley-embed"

networks:
  reverse-proxy:
    # External network created by reverse-proxy setup
    external: true
