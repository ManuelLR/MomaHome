      # Worst alert across all the gauges above: green / yellow / orange / red.
      # `stations` lists the codes that are not green.
      - name: "SAIH worst river alert"
        unique_id: saih_worst_river_alert
        icon: mdi:alert-decagram
        availability: "{{ state_attr('sensor.saih_gauges_raw', 'data') is mapping }}"
        state: >-
          {% set alerts = state_attr('sensor.saih_gauges_raw', 'data').values() | map(attribute='alert') | list %}
          {{ ['red', 'orange', 'yellow', 'green'] | select('in', alerts) | first | default('unknown') }}
        attributes:
          stations: >-
            {{ state_attr('sensor.saih_gauges_raw', 'data').items() | selectattr('1.alert', 'ne', 'green')
                 | map(attribute='0') | join(', ') }}
          updated: "{{ states('sensor.saih_gauges_raw') }}"

