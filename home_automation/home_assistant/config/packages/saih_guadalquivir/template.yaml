          capacity_hm3: "{{ state_attr('sensor.saih_reservoirs_raw', 'data')['E58'].capacity }}"
          level_msnm: "{{ state_attr('sensor.saih_reservoirs_raw', 'data')['E58'].level }}"
      - name: "SAIH E58 Melonares release"
