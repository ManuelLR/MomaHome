# template:
  ##
  # SAIH Guadalquivir - one sensor per station / reservoir (see ./README.md)
  #
  # Everything comes from the raw sensors in command_line.yaml. The script
  # already works out `value` (what the official thresholds apply to) and
  # `alert` (green / yellow / orange / red), so these are plain lookups.
  #
  # Station order: Guadaíra (home, then upstream for early warning),
  # Guadalquivir in Sevilla, and upstream of La Algaba.
  ##

  - sensor:
      - name: "SAIH A55 Guadaíra Sevilla"
        unique_id: saih_a55_guadaira_sevilla
        icon: mdi:waves
        unit_of_measurement: "m"
        state_class: measurement
        availability: "{{ 'A55' in (state_attr('sensor.saih_gauges_raw', 'data') or {}) }}"
        state: "{{ state_attr('sensor.saih_gauges_raw', 'data')['A55'].value }}"
        attributes:
          alert: "{{ state_attr('sensor.saih_gauges_raw', 'data')['A55'].alert }}"
          threshold_yellow: "{{ state_attr('sensor.saih_gauges_raw', 'data')['A55'].threshold_yellow }}"
          threshold_orange: "{{ state_attr('sensor.saih_gauges_raw', 'data')['A55'].threshold_orange }}"
          threshold_red: "{{ state_attr('sensor.saih_gauges_raw', 'data')['A55'].threshold_red }}"
          flow_m3s: "{{ state_attr('sensor.saih_gauges_raw', 'data')['A55'].flow }}"
