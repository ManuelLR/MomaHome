# sensor:
  ##
  # SAIH Guadalquivir - trend of each gauge over the last hour (see ./README.md)
  #
  # Levels are not comparable between stations (each point has its own channel
  # and its own thresholds), but each station's trend is: if the upstream
  # gauges are rising fast, a flood wave is on its way down, whatever their
  # absolute value. Units: m/h for levels, m³/s per hour for the dams.
  ##

  - platform: derivative
    name: "SAIH A55 trend"
    unique_id: saih_a55_trend
    source: sensor.saih_a55_guadaira_sevilla
    unit_time: h
    time_window: "01:00:00"
    round: 2

  - platform: derivative
    name: "SAIH A19 trend"
    unique_id: saih_a19_trend
    source: sensor.saih_a19_guadaira_alcala
    unit_time: h
    time_window: "01:00:00"
    round: 2

