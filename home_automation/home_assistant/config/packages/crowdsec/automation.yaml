# automation:
  # Local bans aimed at one of our domains, or at Traefik/Go itself (no domain
  # needed for those). Community list updates and unbans never reach the webhook.
  - alias: AUT-CrowdSec IP banned
    mode: queued
    max: 20
    triggers:
      - platform: state
        entity_id: sensor.crowdsec_last_ban
    conditions:
      # Only a new ban (new `at`), not the restored state on HA restart/reload
      - condition: template
        value_template: >
          {{ trigger.from_state is not none
             and trigger.from_state.state != 'unavailable'
             and trigger.to_state.attributes.at != trigger.from_state.attributes.at }}
      - condition: template
        value_template: >
          {% set a = trigger.to_state.attributes %}
          {% set domains = a.hosts | default([]) | reject('match', '^[0-9.]+$|^[0-9a-fA-F:]+$') | list %}
          {% set traefik_go = (a.batch | default([]) | select('search', 'traefik', true) | list)
             or (a.paths | default([]) | select('search', '^/(debug/(pprof|vars)|dashboard/?$|api/(rawdata|overview|version|entrypoints|http|tcp|udp))', true) | list) %}
          {{ domains | count > 0 or traefik_go | count > 0 }}
    actions:
      - service: script.telegram_notify
        data:
          target_person: manolo
          title: 'CrowdSec: IP banned'
          message: >
            Banned `{{ trigger.to_state.attributes.ip }}`
            (`{{ trigger.to_state.attributes.country or '?' }}`, `{{ trigger.to_state.attributes.as_name or '?' }}`).

            Scenarios: `{{ trigger.to_state.attributes.batch | join('`, `') }}`
            {%- set hosts = trigger.to_state.attributes.hosts | default([]) %}
            {%- set paths = trigger.to_state.attributes.paths | default([]) %}
            {%- set domains = hosts | reject('match', '^[0-9.]+$|^[0-9a-fA-F:]+$') | list %}

            {% if domains -%}
            Host: `{{ domains | join('`, `') }}`
            {%- elif hosts -%}
            Host: none, sent to the IP (`{{ hosts | join('`, `') }}`)
            {%- else -%}
            Host: none, request without a Host header
            {%- endif %}
            {%- if paths %}

            Paths: `{{ paths[:5] | join('`, `') }}`
            {%- endif %}
