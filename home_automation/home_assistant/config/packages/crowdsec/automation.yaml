# automation:
  ##
  # CrowdSec POSTs the bans of the last 5 s to this webhook
  # (reverse-proxy/crowdsec/notifications/http.yaml).
  # - Every ban is fired as a `crowdsec_ban` event (feeds template.yaml).
  # - The targeted ones (they hit a service configured in Traefik) go into one
  #   message per POST, grouped by IP. Plain text, so attacker-controlled hosts
  #   and paths can never break the formatting, and length-capped. It is also
  #   left as a persistent notification in HA, and if Telegram does not confirm
  #   it, a generic message (no attacker data) is sent instead.
  ##
  - alias: AUT-CrowdSec ban received
    mode: queued
    max: 10
    triggers:
      - platform: webhook
        webhook_id: !secret crowdsec_webhook_id
        allowed_methods:
          - POST
        local_only: true
    actions:
      - variables:
          bans: "{{ trigger.json if trigger.json is list else [] }}"
      - repeat:
          for_each: "{{ bans }}"
          sequence:
            - event: crowdsec_ban
              event_data:
                scenario: "{{ repeat.item.scenario }}"
                ip: "{{ repeat.item.ip }}"
                country: "{{ repeat.item.country }}"
                as_name: "{{ repeat.item.as_name }}"
                hosts: "{{ repeat.item.hosts | default([]) }}"
                paths: "{{ repeat.item.paths | default([]) }}"
                routers: "{{ repeat.item.routers | default([]) }}"
                statuses: "{{ repeat.item.statuses | default([]) }}"
                targeted: "{{ repeat.item.targeted | default(false) | bool(false) }}"
      - variables:
          targeted: "{{ bans | selectattr('targeted') | list }}"
          message: |-
            {%- macro clip(s, n) %}{{ (s | string)[:n] }}{{ '…' if (s | string) | length > n }}{% endmacro %}
            {%- set ips = targeted | map(attribute='ip') | unique | list -%}
            CrowdSec: {{ ips | count }} IP{{ 's' if ips | count != 1 }} banned on your services
            {%- for ip in ips[:10] %}
            {%- set b = targeted | selectattr('ip', 'eq', ip) | list %}
            {%- set scenarios = b | map(attribute='scenario') | unique | list %}
            {%- set hosts = b | map(attribute='hosts') | sum(start=[]) | unique | list %}
            {%- set domains = hosts | reject('match', '^[0-9.]+$|^[0-9a-fA-F:]+$') | list %}
            {%- set paths = b | map(attribute='paths') | sum(start=[]) | unique | list %}
            {%- set routers = b | map(attribute='routers') | sum(start=[]) | unique | reject('search', '@internal$') | list %}
            {%- set statuses = b | map(attribute='statuses') | sum(start=[]) | map('int', 0) | unique | list %}

            {{ loop.index }}) {{ ip }} · {{ b[0].country or '?' }} · {{ clip(b[0].as_name or '?', 40) }}
            Scenario{{ 's' if scenarios | count > 1 }}: {{ scenarios | join(', ') }}
            Host: {{ clip(domains | join(', '), 120) if domains else 'none (sent to the IP or without a Host header)' }}
            {%- if routers %}
            Router: {{ routers | join(', ') }}
            {%- endif %}
            {%- if statuses %}
            Status: {{ statuses | join(', ') }}
            {%- endif %}
            {%- if paths %}
            Paths: {% for p in paths[:5] %}{{ clip(p, 80) }}{{ ', ' if not loop.last }}{% endfor %}{{ ' (+' ~ (paths | count - 5) ~ ' more)' if paths | count > 5 }}
            {%- endif %}
            {%- if scenarios | select('search', 'appsec|vpatch') | list %}
            → Blocked by AppSec (WAF) before reaching the service.
            {%- elif not statuses %}
            {%- elif statuses | select('ge', 200) | select('lt', 400) | list %}
            → Some requests got a 2xx/3xx answer: they reached the service.
            {%- elif statuses | reject('eq', 403) | list | count == 0 %}
            → Every request got a 403 before the service (CrowdSec/AppSec, or the LAN-only allowlist on that router), so it may not have reached it.
            {%- else %}
            → The service answered with an error, so the request reached it.
            {%- endif %}
            {%- endfor %}
            {%- if ips | count > 10 %}

            … and {{ ips | count - 10 }} more IPs (cscli alerts list).
            {%- endif %}
      - condition: template
        value_template: "{{ targeted | count > 0 }}"
      - service: persistent_notification.create
        data:
          notification_id: crowdsec_targeted_ban
          title: CrowdSec
          # Code block: the HA UI renders Markdown, and hosts/paths come from the attacker
          message: "{{ '```\n' ~ ((message | trim)[:3900] | replace('`', \"'\")) ~ '\n```' }}"
      # Detailed message; if it is not confirmed within 60 s, send a generic one
      # with no attacker data in it.
      - variables:
          token: "crowdsec-{{ now().timestamp() }}"
      - service: script.turn_on
        target:
          entity_id: script.crowdsec_telegram_send
        data:
          variables:
            message: "{{ (message | trim)[:3900] }}"
            token: "{{ token }}"
      - wait_for_trigger:
          - platform: event
            event_type: crowdsec_telegram_sent
            event_data:
              token: "{{ token }}"
        timeout: "00:01:00"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ wait.trigger is none }}"
        then:
          - service: script.telegram_notify
            continue_on_error: true
            data:
              target_person: manolo
              parse_mode: plain_text
              message: >-
                CrowdSec banned {{ targeted | map(attribute='ip') | unique | list | count }} IP(s)
                on your services, but the detailed message could not be sent.
                See the CrowdSec notification in Home Assistant or `cscli alerts list`.
