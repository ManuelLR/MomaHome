# automation:
  ##
  # CrowdSec POSTs a list of bans to this webhook (reverse-proxy/crowdsec/notifications/http.yaml).
  # Each ban is fired as a `crowdsec_ban` event (feeds template.yaml) and, when
  # targeted (it hit a service configured in Traefik), sent to Telegram.
  ##
  - alias: AUT-CrowdSec ban received
    mode: parallel
    max: 20
    triggers:
      - platform: webhook
        webhook_id: !secret crowdsec_webhook_id
        allowed_methods:
          - POST
        local_only: true
    actions:
      - repeat:
          for_each: "{{ trigger.json | default([], true) }}"
          sequence:
            - variables:
                b: "{{ repeat.item }}"
            - event: crowdsec_ban
              event_data:
                scenario: "{{ b.scenario }}"
                ip: "{{ b.ip }}"
                country: "{{ b.country }}"
                as_name: "{{ b.as_name }}"
                hosts: "{{ b.hosts | default([]) }}"
                paths: "{{ b.paths | default([]) }}"
                routers: "{{ b.routers | default([]) }}"
                statuses: "{{ b.statuses | default([]) }}"
                targeted: "{{ b.targeted | default(false) }}"
            - if:
                - condition: template
                  value_template: "{{ b.targeted | default(false) | bool(false) }}"
              then:
                - service: script.telegram_notify
                  data:
                    target_person: manolo
                    title: 'CrowdSec: IP banned'
                    message: >
                      Banned `{{ b.ip }}`
                      (`{{ b.country or '?' }}`, `{{ b.as_name or '?' }}`).

                      Scenario: `{{ b.scenario }}`
                      {%- set hosts = b.hosts | default([]) %}
                      {%- set domains = hosts | reject('match', '^[0-9.]+$|^[0-9a-fA-F:]+$') | list %}
                      {%- set paths = b.paths | default([]) %}
                      {%- set routers = b.routers | default([]) | reject('search', '@internal$') | list %}
                      {%- set statuses = b.statuses | default([]) | map('int', 0) | list %}

                      {% if domains -%}
                      Host: `{{ domains | join('`, `') }}`
                      {%- elif hosts -%}
                      Host: none, sent to the IP (`{{ hosts | join('`, `') }}`)
                      {%- else -%}
                      Host: none, request without a Host header
                      {%- endif %}
                      {%- if paths %}

                      Paths: `{{ paths[:5] | join('`, `') }}`
                      {%- endif %}
                      {%- if routers %}

                      Router: `{{ routers | join('`, `') }}`
                      {%- endif %}
                      {%- if statuses %}

                      Status: `{{ statuses | join('`, `') }}`
                      {%- endif %}

                      {% if b.scenario is search('appsec|vpatch') -%}
                      Blocked by AppSec (WAF) before reaching the service.
                      {%- elif not statuses -%}
                      {%- elif statuses | select('ge', 200) | select('lt', 400) | list -%}
                      Some requests got a 2xx/3xx answer: they reached the service.
                      {%- elif statuses | reject('eq', 403) | list | count == 0 -%}
                      Every request got a 403 before the service (CrowdSec/AppSec, or the LAN-only allowlist on that router), so it may not have reached it.
                      {%- else -%}
                      The service answered with an error, so the request reached it.
                      {%- endif %}
