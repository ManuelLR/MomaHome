# script:
  ##
  # Sends the CrowdSec message and, only if that worked, fires
  # `crowdsec_telegram_sent`. A failed send stops this script before the event,
  # so the automation knows it has to fall back to a generic message.
  ##
  crowdsec_telegram_send:
    alias: "CrowdSec Telegram send"
    mode: queued
    fields:
      message:
        selector:
          text:
            multiline: true
      token:
        selector:
          text:
    sequence:
      - service: script.telegram_notify
        data:
          target_person: manolo
          parse_mode: plain_text
          message: "{{ message }}"
      - event: crowdsec_telegram_sent
        event_data:
          token: "{{ token }}"
