# script:
  ##
  # galley e-ink panel - PREVIEW ONLY renderer.
  #
  # Composes the 400x300 BWR layout from sensor.galley_panel_meals /
  # sensor.galley_panel_inventory and calls `gicisky.write` with dry_run: true,
  # so it renders to the integration's PREVIEW camera WITHOUT sending anything to
  # the physical panel over BLE. Flip gicisky_write_dry_run to false to push.
  #
  # Layout (two columns split at x=200):
  #   Left  = meal plan, one black-bar-headed block per day (today .. +4), as
  #           many days as vertically fit. Slot shown as an MDI icon
  #           (croissant/sun/apple/moon/knife/cart). cook/buy in red. Meal text
  #           is hard-clipped only at the column edge (no ellipsis).
  #   Right = NEVERA then CONGELADOR (headers carry a fridge/snowflake icon, no
  #           totals). Each row: name + servings (fork/knife icon). Then the
  #           fridge shows AGE (eaten soon → freshness matters); the freezer
  #           shows the TAPER count (box icon). Oldest-first; fossils in red;
  #           freezer tail truncates with "+N más".
  #   anchor 'lm' = x is left edge, y is vertical center (crisp icon+text align).
  ##
  galley_panel_preview:
    alias: "Galley · preview panel tinta"
    icon: mdi:image-text
    mode: single
    sequence:
      - variables:
          # PREVIEW ONLY. Flip to false (or call gicisky.write_guarded) to push
          # the render to the physical panel over BLE.
          gicisky_write_dry_run: true
          m: "{{ state_attr('sensor.galley_panel_meals','data') or {} }}"
          i: "{{ state_attr('sensor.galley_panel_inventory','data') or {} }}"
      - action: gicisky.write
        data:
          # rotate 0 = landscape 400x300 (this panel). The other Gicisky here
          # (packages/gicisky) uses 270 because it's mounted portrait — confirm
          # on the real device and swap if the layout comes out rotated.
          rotate: 0
          background: white
          dry_run: >
            {{ gicisky_write_dry_run }}
          payload: >-
            {# ---- layout constants (400x300 landscape) ---- #}
            {% set H = 300 %}{% set MID = 200 %}
            {% set LX = 8 %}{% set LVX = 30 %}{% set LTRUNC = 24 %}
            {% set RX = MID + 8 %}{% set RSVI = 312 %}{% set RSVN = 328 %}
            {% set RC2I = 356 %}{% set RC2N = 372 %}{% set RAGE = 350 %}{% set RTRUNC = 14 %}
            {% set RH = 20 %}{% set BAR = 22 %}{% set HGAP = 3 %}{% set SGAP = 5 %}
            {% set micons = {'breakfast':'mdi:food-croissant','lunch':'mdi:weather-sunny','snack':'mdi:food-apple','dinner':'mdi:weather-night','cook':'mdi:knife','buy':'mdi:cart-outline'} %}
            {% set p = namespace(el=[]) %}

            {# ---------------- LEFT COLUMN: meal plan (multi-day) ---------------- #}
            {% set ly = namespace(y=0) %}
            {% for day in (m.days | default([])) %}
              {% if ly.y + BAR + RH <= H %}
                {% set p.el = p.el + [
                  {'type':'rectangle','x_start':0,'y_start':ly.y,'x_end':MID,'y_end':ly.y+BAR,'fill':'black','outline':'black'},
                  {'type':'text','value':day.header,'x':LX,'y':ly.y+(BAR//2),'anchor':'lm','size':14,'color':'white'}] %}
                {% set ly.y = ly.y + BAR + HGAP %}
                {% for r in day.rows %}
                  {% if ly.y + RH <= H %}
                    {% set p.el = p.el + [
                      {'type':'icon','value':micons[r.slot],'x':LX,'y':ly.y+(RH//2),'anchor':'lm','size':15,'color':('red' if r.red else 'black')},
                      {'type':'text','value':((r.text | string)[:LTRUNC]),'x':LVX,'y':ly.y+(RH//2),'anchor':'lm','size':14,'color':('red' if r.red else 'black')}] %}
                    {% set ly.y = ly.y + RH %}
                  {% endif %}
                {% endfor %}
                {% set ly.y = ly.y + SGAP %}
              {% endif %}
            {% endfor %}

            {# ---------------- RIGHT COLUMN: inventory ---------------- #}
            {% set ry = namespace(y=0) %}
            {% set p.el = p.el + [
              {'type':'rectangle','x_start':MID+1,'y_start':ry.y,'x_end':400,'y_end':ry.y+BAR,'fill':'black','outline':'black'},
              {'type':'icon','value':'mdi:fridge','x':RX,'y':ry.y+(BAR//2),'anchor':'lm','size':15,'color':'white'},
              {'type':'text','value':'NEVERA','x':MID+26,'y':ry.y+(BAR//2),'anchor':'lm','size':14,'color':'white'}] %}
            {% set ry.y = ry.y + BAR + HGAP %}
            {% set fr = i.fridge | default([]) %}
            {% if fr | length == 0 %}
              {% set p.el = p.el + [{'type':'text','value':'Nevera vacía','x':RX,'y':ry.y+(RH//2),'anchor':'lm','size':13,'color':'black'}] %}{% set ry.y = ry.y + RH %}
            {% endif %}
            {% for g in fr %}
              {% set col = 'red' if g.fossil else 'black' %}
              {% set p.el = p.el + [
                {'type':'text','value':((g.name|string)[:RTRUNC]),'x':RX,'y':ry.y+(RH//2),'anchor':'lm','size':14,'color':col},
                {'type':'icon','value':'mdi:silverware-fork-knife','x':RSVI,'y':ry.y+(RH//2),'anchor':'lm','size':13,'color':col},
                {'type':'text','value':(g.servings|string),'x':RSVN,'y':ry.y+(RH//2),'anchor':'lm','size':13,'color':col},
                {'type':'text','value':(g.age|string),'x':RAGE,'y':ry.y+(RH//2),'anchor':'lm','size':13,'color':col}] %}
              {% set ry.y = ry.y + RH %}
            {% endfor %}
            {% set ry.y = ry.y + SGAP %}
            {% set p.el = p.el + [
              {'type':'rectangle','x_start':MID+1,'y_start':ry.y,'x_end':400,'y_end':ry.y+BAR,'fill':'black','outline':'black'},
              {'type':'icon','value':'mdi:snowflake','x':RX,'y':ry.y+(BAR//2),'anchor':'lm','size':15,'color':'white'},
              {'type':'text','value':'CONGELADOR','x':MID+26,'y':ry.y+(BAR//2),'anchor':'lm','size':14,'color':'white'}] %}
            {% set ry.y = ry.y + BAR + HGAP %}
            {% set flist = i.freezer | default([]) %}
            {% if flist | length == 0 %}
              {% set p.el = p.el + [{'type':'text','value':'Congelador vacío','x':RX,'y':ry.y+(RH//2),'anchor':'lm','size':13,'color':'black'}] %}{% set ry.y = ry.y + RH %}
            {% endif %}
            {% set fcap = ((H - ry.y) // RH) %}
            {% set ftrunc = flist | length > fcap %}
            {% for g in (flist[:fcap-1] if ftrunc else flist) %}
              {% set col = 'red' if g.fossil else 'black' %}
              {% set p.el = p.el + [
                {'type':'text','value':((g.name|string)[:RTRUNC]),'x':RX,'y':ry.y+(RH//2),'anchor':'lm','size':14,'color':col},
                {'type':'icon','value':'mdi:silverware-fork-knife','x':RSVI,'y':ry.y+(RH//2),'anchor':'lm','size':13,'color':col},
                {'type':'text','value':(g.servings|string),'x':RSVN,'y':ry.y+(RH//2),'anchor':'lm','size':13,'color':col},
                {'type':'icon','value':'mdi:package-variant-closed','x':RC2I,'y':ry.y+(RH//2),'anchor':'lm','size':13,'color':col},
                {'type':'text','value':(g.count|string),'x':RC2N,'y':ry.y+(RH//2),'anchor':'lm','size':13,'color':col}] %}
              {% set ry.y = ry.y + RH %}
            {% endfor %}
            {% if ftrunc %}{% set p.el = p.el + [{'type':'text','value':('+' ~ (flist | length - (fcap-1)) ~ ' más'),'x':RX,'y':ry.y+(RH//2),'anchor':'lm','size':13,'color':'black'}] %}{% endif %}

            {{ p.el }}
        target:
          device_id: !secret galley_panel_device_id
