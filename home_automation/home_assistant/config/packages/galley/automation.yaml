# automation:
  ##
  # Pushes the galley render to the physical Gicisky panel over BLE.
  # Fires on a 10-min tick + HA start; gicisky.write_guarded de-dupes, so the
  # e-ink is only physically written when the rendered content actually changed
  # (protects battery / BLE writes). The condition skips pushing an empty panel
  # while the source sensors are still unavailable (e.g. right after a restart).
  #
  # Cadence: bump the time_pattern down for faster updates, or add a time
  # condition for quiet hours (the panel refresh is cheap thanks to de-dupe).
  ##
  - id: galley_panel_refresh
    alias: "Galley · refrescar panel tinta"
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/10"
      - platform: homeassistant
        event: start
    condition:
      - condition: template
        value_template: "{{ states('sensor.galley_panel_meals') not in ['unavailable', 'unknown'] }}"
    action:
      - action: script.galley_panel_render
        data:
          dry_run: false
