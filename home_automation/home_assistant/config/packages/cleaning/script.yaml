# script:
  # Pressed from the UI ("Mark as paid"): stores the amount due right now as paid.
  # From here on, the next door opening is considered the departure.
  cleaning_mark_paid:
    alias: "Cleaning - Mark as paid"
    icon: mdi:cash-check
    mode: single
    variables:
      start_ts: "{{ state_attr('input_datetime.cleaning_started_at', 'timestamp') | float(0) }}"
      secs: "{{ [as_timestamp(now()) - start_ts, 0] | max }}"
      price: "{{ states('input_number.cleaning_price_per_hour') | float(0) }}"
      amount: "{{ (secs / 3600 * price) | round(2) }}"
      duration_text: "{{ (secs // 3600) | int }}h{{ '%02d' % (((secs % 3600) // 60) | int) }}"
    sequence:
      - condition: state
        entity_id: input_select.cleaning_status
        state: In progress
      - service: input_number.set_value
        target:
          entity_id: input_number.cleaning_amount_paid
        data:
          value: "{{ amount }}"
      - service: input_select.select_option
        target:
          entity_id: input_select.cleaning_status
        data:
          option: Paid
      - service: script.telegram_notify
        data:
          disable_notification: true
          title: '💶 Cleaning visit paid'
          message: >
            {{ duration_text }} → {{ '%.2f' % amount }} €.
            The next door opening will be registered as the departure.

  # Closes the cleaning visit: creates the record event in calendar.cleaning_log,
  # sends the summary and goes back to Idle.
  cleaning_finalize:
    alias: "Cleaning - Close visit"
    icon: mdi:broom
    mode: single
    variables:
      start_ts: "{{ state_attr('input_datetime.cleaning_started_at', 'timestamp') | float(0) }}"
      end_ts: "{{ state_attr('input_datetime.cleaning_ended_at', 'timestamp') | float(0) }}"
      secs: "{{ [end_ts - start_ts, 0] | max }}"
      price: "{{ states('input_number.cleaning_price_per_hour') | float(0) }}"
      due: "{{ (secs / 3600 * price) | round(2) }}"
      was_paid: "{{ is_state('input_select.cleaning_status', 'Paid') }}"
      paid: "{{ states('input_number.cleaning_amount_paid') | float(0) if was_paid else 0 }}"
      duration_text: "{{ (secs // 3600) | int }}h{{ '%02d' % (((secs % 3600) // 60) | int) }}"
    sequence:
      - condition: state
        entity_id: input_select.cleaning_status
        state:
          - In progress
          - Paid
      - service: timer.cancel
        target:
          entity_id: timer.cleaning_finalize_in
      - service: calendar.create_event
        continue_on_error: true
        target:
          entity_id: calendar.cleaning_log
        data:
          summary: >
            🧹 Cleaning {{ duration_text }} · {{ '%.2f' % (paid if was_paid else due) }} €{{ '' if was_paid else ' (payment pending)' }}
          description: |
            Started: {{ start_ts | timestamp_custom('%H:%M') }}
            Ended: {{ end_ts | timestamp_custom('%H:%M') }}
            Duration: {{ duration_text }}
            Price per hour: {{ '%.2f' % price }} €
            Amount due at departure: {{ '%.2f' % due }} €
            Paid: {{ ('%.2f €' % paid) if was_paid else 'pending' }}
          start_date_time: "{{ start_ts | timestamp_local }}"
          end_date_time: "{{ [end_ts, start_ts + 60] | max | timestamp_local }}"
      - service: input_select.select_option
        target:
          entity_id: input_select.cleaning_status
        data:
          option: Idle
      - service: script.telegram_notify
        data:
          title: '👋 Cleaning visit finished'
          message: >
            {{ start_ts | timestamp_custom('%H:%M') }}–{{ end_ts | timestamp_custom('%H:%M') }} ({{ duration_text }}).
            {% if was_paid %}Paid: {{ '%.2f' % paid }} €.
            {% else %}⚠️ No payment registered: {{ '%.2f' % due }} € are due.
            {% endif %}
            Saved in the "Cleaning log" calendar.

  # Helper for the Telegram callbacks: answers the callback (small toast) and replaces
  # the pressed message text (which also removes its buttons).
  cleaning_telegram_reply:
    alias: "Cleaning - Reply Telegram callback"
    mode: parallel
    fields:
      callback:
        description: "trigger.event.data of the telegram_callback event"
        required: true
        selector:
          object:
      answer:
        required: true
        selector:
          text:
      new_text:
        required: false
        selector:
          text:
            multiline: true
    sequence:
      - service: telegram_bot.answer_callback_query
        continue_on_error: true
        data:
          callback_query_id: "{{ callback.id }}"
          message: "{{ answer }}"
      - if: "{{ new_text is defined and new_text | length > 0 and callback.message is not none }}"
        then:
          - service: telegram_bot.edit_message
            continue_on_error: true
            data:
              chat_id: "{{ callback.chat_id }}"
              message_id: "{{ callback.message.message_id }}"
              message: "{{ new_text }}"
              parse_mode: plain_text
