# input_select:
  # Single source of truth for the cleaning visit. Other automations should use it
  # as condition (anything but Idle means someone is, or is about to be, cleaning).
  cleaning_status:
    name: Cleaning
    icon: mdi:broom
    options:
      # No visit now (or outside the calendar slot)
      - Idle
      # calendar.cleaning event is active, waiting for the arrival
      - Expected
      # Arrival confirmed from Telegram, clock is running
      - In progress
      # Payment registered: the next door opening is the departure
      - Paid
    # initial: Idle
