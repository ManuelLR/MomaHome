# script:
  # Ends the night ("sign of life"). Does nothing before the earliest wake-up time (night
  # interruption) or if it is not night. Called by "AUT-Sleep wake-up" and by other
  # packages with their own signals (e.g. packages/dog: walk, meal, accident).
  sleep_wake_up:
    alias: "Sleep - Wake-up signal"
    icon: mdi:weather-sunset-up
    mode: queued
    fields:
      woke_by:
        description: "What woke us up (stored in sensor.sleep_last_night)"
        required: true
        selector:
          text:
    sequence:
      - condition: state
        entity_id: input_boolean.sleep_night
        state: 'on'
      - condition: time
        after: input_datetime.sleep_earliest_wake
        before: '21:00:00'
      - event: sleep_night_ended
        event_data:
          start: "{{ state_attr('input_datetime.sleep_started_at', 'timestamp') | float(0) }}"
          end: "{{ as_timestamp(now()) }}"
          woke_by: "{{ woke_by }}"
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.sleep_night
