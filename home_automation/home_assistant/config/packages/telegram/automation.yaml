# automation:

  - alias: AUT-Telegram turn on device
    mode: restart
    initial_state: 'on'
    triggers:
      - platform: event
        event_type: telegram_command
        event_data: &telegram_turn_on_device
          command: "/turn_on"
      - platform: event
        event_type: telegram_callback
        event_data: *telegram_turn_on_device
    actions:
      - service: switch.turn_on
        data_template:
          entity_id: >
              {% if trigger.event.event_type == 'telegram_command' %}
                {{trigger.event.data["args"][0]|default('entity not passed')}}
              {% elif trigger.event.event_type == 'telegram_callback' %}
                {{trigger.event.data["data"].split(' ')[1]|default('entity not passed')}}
              {% else %}
                switch.event_not_recognized
              {% endif %}
      # Answer to the telegram callback if needed
      - condition: template
        value_template: "{{  trigger.event.event_type == 'telegram_callback' }}"
      - service: telegram_bot.answer_callback_query
        data:
          callback_query_id: "{{ trigger.event.data.id }}"
          message: "Done!"

  # Generic "turn off" for any entity, e.g. a button `Label:/turn_off input_boolean.x`.
  # Only allowed Telegram chats can send callbacks. Plain fields are used on purpose:
  # trigger.event.data contains python-telegram-bot enums and cannot be passed as a dict.
  - alias: AUT-Telegram turn off entity
    id: aut_telegram_turn_off_entity
    mode: queued
    initial_state: 'on'
    triggers:
      - trigger: event
        event_type: telegram_command
        event_data: &telegram_turn_off_entity
          command: "/turn_off"
      - trigger: event
        event_type: telegram_callback
        event_data: *telegram_turn_off_entity
    variables:
      target_entity: "{{ trigger.event.data.args[0] | default('') }}"
    conditions:
      - condition: template
        value_template: "{{ target_entity.count('.') == 1 and states(target_entity) not in ['unknown', 'unavailable'] }}"
    actions:
      - service: homeassistant.turn_off
        target:
          entity_id: "{{ target_entity }}"
      # Answer the callback and mark the pressed message as done (removes its buttons)
      - condition: template
        value_template: "{{ trigger.event.event_type == 'telegram_callback' }}"
      - service: telegram_bot.answer_callback_query
        continue_on_error: true
        data:
          callback_query_id: "{{ trigger.event.data.id }}"
          message: "Done!"
      - if: "{{ trigger.event.data.message is not none }}"
        then:
          - service: telegram_bot.edit_message
            continue_on_error: true
            data:
              chat_id: "{{ trigger.event.data.chat_id }}"
              message_id: "{{ trigger.event.data.message.message_id }}"
              message: "{{ trigger.event.data.message.text ~ '\n\n✅ Done' }}"
              parse_mode: plain_text
