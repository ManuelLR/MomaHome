# automation:
  # Flow (see README.md):
  #   person leaves ──(Telegram "Is the dog with you?" ✅)──> dog_out on (start = time they left)
  #   walker arrives ──(Telegram 💧/💩/💧💩/🚫)──> dog_walk_finalize (end = time they arrived) ──> dog_out off
  # Everything can also be done by hand with the Telegram /dog command or the "Dog" view.

  ########################################
  ## Presence
  ########################################
  - alias: AUT-Dog ask on leaving
    id: aut_dog_ask_on_leaving
    initial_state: 'on'
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - person.manolo
          - person.monica
        from: home
        to: not_home
    conditions:
      - condition: state
        entity_id: input_boolean.dog_out
        state: 'off'
    variables:
      left_ts: "{{ as_timestamp(trigger.to_state.last_changed) | int }}"
      left_hm: "{{ left_ts | timestamp_custom('%H:%M') }}"
    actions:
      - service: script.telegram_notify
        data:
          target_person: "{{ trigger.entity_id.split('.')[1] }}"
          title: '🐶 You left home at {{ left_hm }}'
          message: 'Is the dog with you?'
          inline_keyboard:
            - '✅ Yes (since {{ left_hm }}):/dog_out {{ left_ts }}, ❌ No:/dog_ignore'

  # Only the walker is asked (or anyone arriving if the walk was started by hand).
  - alias: AUT-Dog ask on arrival
    id: aut_dog_ask_on_arrival
    initial_state: 'on'
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - person.manolo
          - person.monica
        from: not_home
        to: home
    conditions:
      - condition: state
        entity_id: input_boolean.dog_out
        state: 'on'
      - condition: template
        value_template: "{{ states('input_select.dog_walker') in [trigger.to_state.name, 'Someone'] }}"
    variables:
      back_ts: "{{ as_timestamp(trigger.to_state.last_changed) | int }}"
      start_ts: "{{ state_attr('input_datetime.dog_walk_started_at', 'timestamp') | float(0) }}"
    actions:
      - service: script.dog_ask_walk_result
        data:
          target_person: "{{ trigger.entity_id.split('.')[1] }}"
          title: "🏠 Back home at {{ back_ts | timestamp_custom('%H:%M') }}"
          message: >
            {{ ((back_ts - start_ts) / 60) | round(0) | int }} min walk. What did the dog do?
          back_ts: "{{ back_ts }}"
          not_back_label: '❌ The dog is not with me'

  ########################################
  ## Reminders
  ########################################
  # Walk open for too long: the arrival was missed (no keys/tracker) or not answered.
  # Offers to close it at the walker's last arrival home, if any after the start.
  - alias: AUT-Dog walk too long
    id: aut_dog_walk_too_long
    initial_state: 'on'
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.dog_out
        to: 'on'
        for: '02:00:00'
    variables:
      walker: "{{ states('input_select.dog_walker') }}"
      walker_entity: "person.{{ walker | lower }}"
      start_ts: "{{ state_attr('input_datetime.dog_walk_started_at', 'timestamp') | float(0) }}"
      arrived_ts: >
        {% if walker != 'Someone' and is_state(walker_entity, 'home') %}{{ as_timestamp(states[walker_entity].last_changed) | int }}{% else %}0{% endif %}
      back_ts: "{{ arrived_ts if arrived_ts > start_ts else 0 }}"
    actions:
      - service: script.dog_ask_walk_result
        data:
          target_person: "{{ 'auto' if walker == 'Someone' else walker | lower }}"
          title: '🐶 Is the dog still out?'
          message: >
            The walk started at {{ start_ts | timestamp_custom('%H:%M') }}.
            {% if back_ts > 0 %}If it came back with you at {{ back_ts | timestamp_custom('%H:%M') }}{% else %}If it is already back (time = now){% endif %}, what did it do?
          back_ts: "{{ back_ts }}"

  # Too long without going out / peeing / pooping. Hours are counted without the night
  # (input_datetime.dog_quiet_start → dog_quiet_end, custom_templates/dog.jinja), so the
  # night does not set them off in the morning. Only outside the night and with someone
  # at home; if nobody is home it is sent to whoever arrives.
  - alias: AUT-Dog overdue reminders
    id: aut_dog_overdue_reminders
    initial_state: 'on'
    mode: queued
    max: 3
    triggers:
      - trigger: numeric_state
        id: walk
        entity_id: sensor.dog_awake_hours_since_last_walk
        above: input_number.dog_walk_reminder_hours
      - trigger: numeric_state
        id: pee
        entity_id: sensor.dog_awake_hours_since_last_pee
        above: input_number.dog_pee_reminder_hours
      - trigger: numeric_state
        id: poop
        entity_id: sensor.dog_awake_hours_since_last_poop
        above: input_number.dog_poop_reminder_hours
      - trigger: state
        id: arrived
        entity_id: sensor.home_occupancy_status
        to: Just Arrived
        not_from:
          - unknown
          - unavailable
    conditions:
      - condition: state
        entity_id: input_boolean.dog_out
        state: 'off'
      - condition: time
        after: input_datetime.dog_quiet_end
        before: input_datetime.dog_quiet_start
      - condition: state
        entity_id: sensor.home_occupancy_status
        state:
          - Home
          - Just Arrived
    variables:
      checks:
        - key: walk
          text: '🚶 Not out'
          sensor: sensor.dog_awake_hours_since_last_walk
          limit: input_number.dog_walk_reminder_hours
          last: input_datetime.dog_walk_ended_at
        - key: pee
          text: '💧 No pee'
          sensor: sensor.dog_awake_hours_since_last_pee
          limit: input_number.dog_pee_reminder_hours
          last: sensor.dog_last_pee
        - key: poop
          text: '💩 No poop'
          sensor: sensor.dog_awake_hours_since_last_poop
          limit: input_number.dog_poop_reminder_hours
          last: sensor.dog_last_poop
      # On arrival: everything overdue. Otherwise: only what crossed the limit now.
      lines: >
        {% set ns = namespace(lines=[]) %}
        {% for c in checks if (trigger.id == 'arrived' or trigger.id == c.key)
             and states(c.sensor) | float(0) > states(c.limit) | float(999) %}
          {% set last_ts = as_timestamp(states(c.last), 0) %}
          {% set ns.lines = ns.lines + [c.text ~ ' for ' ~ states(c.sensor) | float | round(1) ~ ' h (since '
               ~ (last_ts | timestamp_custom('%a %H:%M') if last_ts > 0 else '?') ~ ')'] %}
        {% endfor %}
        {{ ns.lines }}
    actions:
      - condition: template
        value_template: "{{ lines | count > 0 }}"
      - service: script.telegram_notify
        data:
          title: "{{ '🏠 Welcome! The dog needs to go out' if trigger.id == 'arrived' else '🐶 Time for a walk?' }}"
          message: |
            {{ lines | join('\n') }}
            (hours awake, the night is not counted)
          inline_keyboard:
            - '🚶 Going out now:/dog_out 0'
            - '💧 Pee at home:/dog_accident pee, 💩 Poop at home:/dog_accident poop'

  ########################################
  ## Meals
  ########################################
  - alias: AUT-Dog meal reminder
    id: aut_dog_meal_reminder
    initial_state: 'on'
    mode: single
    triggers:
      - trigger: time
        at:
          - input_datetime.dog_meal_morning
          - input_datetime.dog_meal_evening
    conditions:
      # Not if it was already fed (early) in the last 2 hours
      - condition: template
        value_template: >
          {{ not has_value('sensor.dog_last_meal')
             or as_timestamp(now()) - as_timestamp(states('sensor.dog_last_meal'), 0) > 7200 }}
    variables:
      meal: "{{ 'Breakfast' if now().hour < 14 else 'Dinner' }}"
    actions:
      - &dog_meal_notify
        service: script.telegram_notify
        data:
          title: "🍽️ {{ meal }} time for the dog"
          message: "Press the button once it has eaten, so nobody feeds it twice."
          inline_keyboard:
            - '✅ Fed:/dog_fed 0'
      # Once more if nobody marks it as fed
      - wait_for_trigger:
          - trigger: event
            event_type: dog_meal_logged
        timeout: '00:45:00'
        continue_on_timeout: true
      - condition: template
        value_template: "{{ wait.trigger is none }}"
      - <<: *dog_meal_notify
        data:
          title: "🍽️ Has the dog had its {{ meal | lower }}?"
          message: "Nobody has marked it as fed yet."
          inline_keyboard:
            - '✅ Fed:/dog_fed 0'

  # Puppies usually need to go out a while after eating: reminder if it has not gone out
  - alias: AUT-Dog walk after meal
    id: aut_dog_walk_after_meal
    initial_state: 'on'
    mode: restart
    triggers:
      - trigger: event
        event_type: dog_meal_logged
    variables:
      meal_hm: "{{ trigger.event.data.ts | float(0) | timestamp_custom('%H:%M') }}"
      wait_minutes: "{{ states('input_number.dog_after_meal_walk_minutes') | int(20) }}"
    actions:
      - wait_for_trigger:
          - trigger: state
            entity_id: input_boolean.dog_out
            to: 'on'
        timeout:
          minutes: "{{ wait_minutes }}"
        continue_on_timeout: true
      - condition: template
        value_template: "{{ wait.trigger is none and is_state('input_boolean.dog_out', 'off') }}"
      - service: script.telegram_notify
        data:
          title: '🍽️ → 🚶 Walk after the meal?'
          message: "It ate at {{ meal_hm }} ({{ wait_minutes }} min ago): it usually needs to poop now."
          inline_keyboard:
            - '🚶 Going out now:/dog_out 0'
            - '💧 Pee at home:/dog_accident pee, 💩 Poop at home:/dog_accident poop'

  ########################################
  ## Settings
  ########################################
  # Default settings, applied once (the helpers have no `initial`, so values changed
  # from the UI are kept). Turn input_boolean.dog_defaults_applied off to restore them.
  - alias: AUT-Dog default settings
    id: aut_dog_default_settings
    initial_state: 'on'
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
      - trigger: state
        entity_id: input_boolean.dog_defaults_applied
        to: 'off'
    conditions:
      - condition: state
        entity_id: input_boolean.dog_defaults_applied
        state: 'off'
    actions:
      - repeat:
          for_each:
            - {entity: input_number.dog_walk_daily_goal_minutes, value: 60}
            - {entity: input_number.dog_walk_reminder_hours, value: 3}
            - {entity: input_number.dog_pee_reminder_hours, value: 3}
            - {entity: input_number.dog_poop_reminder_hours, value: 6}
            - {entity: input_number.dog_after_meal_walk_minutes, value: 20}
          sequence:
            - service: input_number.set_value
              target:
                entity_id: "{{ repeat.item.entity }}"
              data:
                value: "{{ repeat.item.value }}"
      - repeat:
          for_each:
            - {entity: input_datetime.dog_meal_morning, value: '07:30:00'}
            - {entity: input_datetime.dog_meal_evening, value: '19:30:00'}
            - {entity: input_datetime.dog_quiet_start, value: '23:30:00'}
            - {entity: input_datetime.dog_quiet_end, value: '07:30:00'}
          sequence:
            - service: input_datetime.set_datetime
              target:
                entity_id: "{{ repeat.item.entity }}"
              data:
                time: "{{ repeat.item.value }}"
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.dog_defaults_applied

  # Evening check of the daily goal, while there is still time for a walk
  - alias: AUT-Dog daily goal check
    id: aut_dog_daily_goal_check
    initial_state: 'on'
    triggers:
      - trigger: time
        at: '20:30:00'
    variables:
      minutes: "{{ states('sensor.dog_walk_minutes_today') | int(0) }}"
      goal: "{{ states('input_number.dog_walk_daily_goal_minutes') | int(0) }}"
    conditions:
      - condition: template
        value_template: "{{ goal > 0 and minutes < goal }}"
    actions:
      - service: script.telegram_notify
        data:
          title: '🐶 Daily walk goal not reached'
          message: >
            Today: {{ minutes }} of {{ goal }} min ({{ states('sensor.dog_walks_today') | int(0) }} walks).
            {{ goal - minutes }} min left.

  # One all-day event per day in calendar.dog_log with the totals (the diary)
  - alias: AUT-Dog daily summary
    id: aut_dog_daily_summary
    initial_state: 'on'
    triggers:
      - trigger: time
        at: '23:58:00'
    actions:
      # Only if the Local Calendar exists (README.md): a missing action would abort the caller
      - if: "{{ has_value('calendar.dog_log') }}"
        then:
          - service: calendar.create_event
            continue_on_error: true
            target:
              entity_id: calendar.dog_log
            data:
              summary: >
                📊 {{ states('sensor.dog_walk_minutes_today') | int(0) }} min
                · {{ states('sensor.dog_walks_today') | int(0) }} walks
                · 💧{{ states('sensor.dog_pees_today') | int(0) }}
                💩{{ states('sensor.dog_poops_today') | int(0) }}
                {%- if states('sensor.dog_accidents_today') | int(0) > 0 %} · ⚠️{{ states('sensor.dog_accidents_today') | int(0) }}{% endif %}
                · 🍽️{{ states('sensor.dog_meals_today') | int(0) }}
              description: >
                Goal: {{ states('input_number.dog_walk_daily_goal_minutes') | int(0) }} min
              start_date: "{{ now().date() }}"
              end_date: "{{ (now() + timedelta(days=1)).date() }}"

  ########################################
  ## Telegram
  ########################################
  # /dog_out <ts> (0 = now). The walker is whoever pressed the button.
  - alias: AUT-Dog Telegram out
    id: aut_dog_telegram_out
    initial_state: 'on'
    mode: queued
    triggers:
      - trigger: event
        event_type: telegram_callback
        event_data:
          command: "/dog_out"
    variables: &dog_telegram_vars
      chat_ids: &dog_chat_ids
        Manolo: !secret telegram_userid_manolo
        Monica: !secret telegram_userid_monica
      who: >
        {% set ns = namespace(name='Someone') %}
        {% for name, chat in chat_ids.items() if (chat | string) == (trigger.event.data.chat_id | string) %}{% set ns.name = name %}{% endfor %}
        {{ ns.name }}
      arg_ts: "{{ (trigger.event.data.args or ['0'])[0] | int(0) }}"
      at_ts: "{{ arg_ts if arg_ts > 0 else as_timestamp(now()) | int }}"
      at_hm: "{{ at_ts | timestamp_custom('%H:%M') }}"
      reply: &dog_reply
        callback_id: "{{ trigger.event.data.id }}"
        chat_id: "{{ trigger.event.data.chat_id }}"
        message_id: "{{ trigger.event.data.message.message_id if trigger.event.data.message else 0 }}"
    actions:
      - if:
          - condition: state
            entity_id: input_boolean.dog_out
            state: 'off'
        then:
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dog_walk_started_at
            data:
              timestamp: "{{ at_ts }}"
          - service: input_select.select_option
            target:
              entity_id: input_select.dog_walker
            data:
              option: "{{ who }}"
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.dog_out
          # (script.cleaning_telegram_reply is a generic callback reply, packages/cleaning)
          - service: script.cleaning_telegram_reply
            data:
              <<: *dog_reply
              answer: "Walk started at {{ at_hm }}"
              new_text: "🚶 Walk started at {{ at_hm }} ({{ who }}). I will ask when you are back."
        else:
          - service: script.cleaning_telegram_reply
            data:
              <<: *dog_reply
              answer: "The dog is already out with {{ states('input_select.dog_walker') }}"
              new_text: "🐶 The dog was already out with {{ states('input_select.dog_walker') }}."

  # /dog_back <ts> <p|c|pc|n> (ts 0 = now)
  - alias: AUT-Dog Telegram back
    id: aut_dog_telegram_back
    initial_state: 'on'
    mode: queued
    triggers:
      - trigger: event
        event_type: telegram_callback
        event_data:
          command: "/dog_back"
    variables:
      <<: *dog_telegram_vars
      code: "{{ (trigger.event.data.args or ['0', 'n'])[1] | default('n') }}"
      pee: "{{ 'p' in code }}"
      poop: "{{ 'c' in code }}"
      start_ts: "{{ state_attr('input_datetime.dog_walk_started_at', 'timestamp') | float(0) }}"
      did: "{{ ('💧' if pee else '') ~ ('💩' if poop else '') or '🚫 nothing' }}"
    actions:
      - if:
          - condition: state
            entity_id: input_boolean.dog_out
            state: 'on'
        then:
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.dog_walk_ended_at
            data:
              timestamp: "{{ [at_ts, start_ts + 60] | max | int }}"
          # Close first: replying to Telegram must never block it
          - service: script.dog_walk_finalize
            data:
              pee: "{{ pee }}"
              poop: "{{ poop }}"
          - service: script.cleaning_telegram_reply
            data:
              <<: *dog_reply
              answer: "Saved: {{ did }}"
              new_text: >
                🏠 Back at {{ at_hm }} after {{ (([at_ts - start_ts, 0] | max) / 60) | round(0) | int }} min · {{ did }}. Saved.
        else:
          - service: script.cleaning_telegram_reply
            data:
              <<: *dog_reply
              answer: "No longer applies: the walk is already closed"
              new_text: "🐶 That walk was already closed."

  - alias: AUT-Dog Telegram cancel walk
    id: aut_dog_telegram_cancel_walk
    initial_state: 'on'
    mode: queued
    triggers:
      - trigger: event
        event_type: telegram_callback
        event_data:
          command: "/dog_cancel"
    actions:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.dog_out
      - service: script.cleaning_telegram_reply
        data:
          <<: *dog_reply
          answer: "Walk discarded"
          new_text: "🗑️ Walk discarded (not saved)."

  - alias: AUT-Dog Telegram ignore
    id: aut_dog_telegram_ignore
    initial_state: 'on'
    mode: queued
    triggers:
      - trigger: event
        event_type: telegram_callback
        event_data:
          command: "/dog_ignore"
    actions:
      - service: script.cleaning_telegram_reply
        data:
          <<: *dog_reply
          answer: "OK"
          new_text: "{{ trigger.event.data.message.text if trigger.event.data.message else '' }}\n\n👍 OK"

  # /dog_accident <pee|poop>
  - alias: AUT-Dog Telegram accident
    id: aut_dog_telegram_accident
    initial_state: 'on'
    mode: queued
    triggers:
      - trigger: event
        event_type: telegram_callback
        event_data:
          command: "/dog_accident"
    variables:
      kind: "{{ (trigger.event.data.args or ['pee'])[0] }}"
    conditions:
      - condition: template
        value_template: "{{ kind in ['pee', 'poop'] }}"
    actions:
      - service: script.dog_log_accident
        data:
          kind: "{{ kind }}"
      # Answer only (keep the buttons: there may be more than one accident)
      - service: telegram_bot.answer_callback_query
        continue_on_error: true
        data:
          callback_query_id: "{{ trigger.event.data.id }}"
          message: "Saved: {{ '💧 pee' if kind == 'pee' else '💩 poop' }} at home"

  # /dog_fed <ts> (0 = now). Refused if it already ate in the last hour (no double meals).
  - alias: AUT-Dog Telegram fed
    id: aut_dog_telegram_fed
    initial_state: 'on'
    mode: queued
    triggers:
      - trigger: event
        event_type: telegram_callback
        event_data:
          command: "/dog_fed"
    variables:
      <<: *dog_telegram_vars
      last_meal_ts: "{{ as_timestamp(states('sensor.dog_last_meal'), 0) }}"
    actions:
      - if: "{{ at_ts - last_meal_ts > 3600 }}"
        then:
          - service: script.dog_log_meal
            data:
              ts: "{{ at_ts }}"
              by: "{{ who }}"
          - service: script.cleaning_telegram_reply
            data:
              <<: *dog_reply
              answer: "Fed at {{ at_hm }}"
              new_text: "🍽️ Fed at {{ at_hm }} ({{ who }})."
        else:
          - service: script.cleaning_telegram_reply
            data:
              <<: *dog_reply
              answer: "⚠️ It already ate at {{ last_meal_ts | timestamp_custom('%H:%M') }}"
              new_text: >
                ⚠️ It already ate at {{ last_meal_ts | timestamp_custom('%H:%M') }}
                ({{ state_attr('sensor.dog_last_meal', 'by') }}). Not saved again.

  # /dog typed in the bot chat: today's summary plus the buttons that apply now
  - alias: AUT-Dog Telegram menu
    id: aut_dog_telegram_menu
    initial_state: 'on'
    mode: queued
    triggers:
      - trigger: event
        event_type: telegram_command
        event_data:
          command: "/dog"
    variables:
      chat_ids: *dog_chat_ids
      who: >
        {% set ns = namespace(name='') %}
        {% for name, chat in chat_ids.items() if (chat | string) == (trigger.event.data.chat_id | string) %}{% set ns.name = name %}{% endfor %}
        {{ ns.name }}
      summary: >
        Today: {{ states('sensor.dog_walks_today') | int(0) }} walks · {{ states('sensor.dog_walk_minutes_today') | int(0) }}
        of {{ states('input_number.dog_walk_daily_goal_minutes') | int(0) }} min ·
        💧{{ states('sensor.dog_pees_today') | int(0) }} 💩{{ states('sensor.dog_poops_today') | int(0) }}
        {%- if states('sensor.dog_accidents_today') | int(0) > 0 %} · ⚠️{{ states('sensor.dog_accidents_today') | int(0) }} at home{% endif %}.
        Last pee: {{ as_timestamp(states('sensor.dog_last_pee'), 0) | timestamp_custom('%a %H:%M') if has_value('sensor.dog_last_pee') else '-' }} ·
        last poop: {{ as_timestamp(states('sensor.dog_last_poop'), 0) | timestamp_custom('%a %H:%M') if has_value('sensor.dog_last_poop') else '-' }} ·
        last meal: {{ as_timestamp(states('sensor.dog_last_meal'), 0) | timestamp_custom('%a %H:%M') if has_value('sensor.dog_last_meal') else '-' }}.
    conditions:
      - condition: template
        value_template: "{{ who != '' }}"
    actions:
      - if:
          - condition: state
            entity_id: input_boolean.dog_out
            state: 'on'
        then:
          - service: script.dog_ask_walk_result
            data:
              target_person: "{{ who | lower }}"
              title: "🐶 Out with {{ states('input_select.dog_walker') }} since {{ state_attr('input_datetime.dog_walk_started_at', 'timestamp') | float(0) | timestamp_custom('%H:%M') }}"
              message: "{{ summary }}\nBack now? What did it do?"
              back_ts: 0
        else:
          - service: script.telegram_notify
            data:
              target_person: "{{ who | lower }}"
              title: '🐶 Dog at home'
              message: "{{ summary }}"
              inline_keyboard:
                - '🚶 Going out now:/dog_out 0, 🍽️ Fed now:/dog_fed 0'
                - '💧 Pee at home:/dog_accident pee, 💩 Poop at home:/dog_accident poop'
