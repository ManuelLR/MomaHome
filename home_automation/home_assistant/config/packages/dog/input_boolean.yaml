# input_boolean:
  # Single source of truth for "the dog is out on a walk" (see README.md)
  dog_out:
    name: Dog out
    icon: mdi:dog-side
  # On once the default settings have been applied (AUT-Dog default settings). Turn it
  # off to restore the defaults.
  dog_defaults_applied:
    name: Dog default settings applied
    icon: mdi:cog-refresh
  # Everybody asleep (see README "Night"): no reminders, and this time does not count
  # as "time without going out / peeing / pooping"
  dog_night:
    name: Dog night
    icon: mdi:sleep
