# template:
  # Daily counters, fed by the events fired by script.dog_walk_finalize (dog_walk_logged)
  # and script.dog_log_accident (dog_accident_logged), reset at midnight. They are
  # computed from the logged walks (real start/end times carried by the Telegram
  # buttons), not from the history of input_boolean.dog_out, so answering late does not
  # change the figures. state_class: measurement → long-term statistics, so the
  # dashboard can show one bar per day ("screen time", dog version) beyond the recorder
  # purge_keep_days.
  - triggers:
      - trigger: event
        id: walk
        event_type: dog_walk_logged
      - trigger: event
        id: accident
        event_type: dog_accident_logged
      - trigger: event
        id: meal
        event_type: dog_meal_logged
      - trigger: time
        id: midnight
        at: '00:00:00'
    sensor:
      - name: Dog walk minutes today
        unique_id: dog_walk_minutes_today
        default_entity_id: sensor.dog_walk_minutes_today
        icon: mdi:dog-side
        unit_of_measurement: min
        state_class: measurement
        state: >
          {% set current = this.state | int(0) %}
          {% if trigger.id == 'midnight' %}0
          {% elif trigger.id == 'walk' %}{{ current + (trigger.event.data.minutes | int(0)) }}
          {% else %}{{ current }}{% endif %}
      - name: Dog walks today
        unique_id: dog_walks_today
        default_entity_id: sensor.dog_walks_today
        icon: mdi:counter
        state_class: measurement
        state: >
          {% set current = this.state | int(0) %}
          {% if trigger.id == 'midnight' %}0
          {% elif trigger.id == 'walk' %}{{ current + 1 }}
          {% else %}{{ current }}{% endif %}
      - name: Dog pees today
        unique_id: dog_pees_today
        default_entity_id: sensor.dog_pees_today
        icon: mdi:water
        state_class: measurement
        state: >
          {% set current = this.state | int(0) %}
          {% if trigger.id == 'midnight' %}0
          {% elif trigger.id == 'walk' and trigger.event.data.pee | bool(false) %}{{ current + 1 }}
          {% else %}{{ current }}{% endif %}
      - name: Dog poops today
        unique_id: dog_poops_today
        default_entity_id: sensor.dog_poops_today
        icon: mdi:emoticon-poop
        state_class: measurement
        state: >
          {% set current = this.state | int(0) %}
          {% if trigger.id == 'midnight' %}0
          {% elif trigger.id == 'walk' and trigger.event.data.poop | bool(false) %}{{ current + 1 }}
          {% else %}{{ current }}{% endif %}
      # Pees/poops at home (logged by hand from Telegram /dog or the dashboard)
      - name: Dog accidents today
        unique_id: dog_accidents_today
        default_entity_id: sensor.dog_accidents_today
        icon: mdi:alert-circle-outline
        state_class: measurement
        state: >
          {% set current = this.state | int(0) %}
          {% if trigger.id == 'midnight' %}0
          {% elif trigger.id == 'accident' %}{{ current + 1 }}
          {% else %}{{ current }}{% endif %}
      - name: Dog meals today
        unique_id: dog_meals_today
        default_entity_id: sensor.dog_meals_today
        icon: mdi:food-drumstick
        state_class: measurement
        state: >
          {% set current = this.state | int(0) %}
          {% if trigger.id == 'midnight' %}0
          {% elif trigger.id == 'meal' %}{{ current + 1 }}
          {% else %}{{ current }}{% endif %}

  # Last pee / poop (outside or at home), to know how long it has been
  - triggers:
      - trigger: event
        event_type: dog_walk_logged
      - trigger: event
        event_type: dog_accident_logged
    sensor:
      - name: Dog last pee
        unique_id: dog_last_pee
        default_entity_id: sensor.dog_last_pee
        icon: mdi:water
        device_class: timestamp
        state: >
          {% if trigger.event.data.pee | bool(false) %}{{ (trigger.event.data.ts | float) | as_datetime | as_local }}
          {% elif this.state not in ['unknown', 'unavailable', 'None'] %}{{ this.state }}
          {% else %}None{% endif %}
      - name: Dog last poop
        unique_id: dog_last_poop
        default_entity_id: sensor.dog_last_poop
        icon: mdi:emoticon-poop
        device_class: timestamp
        state: >
          {% if trigger.event.data.poop | bool(false) %}{{ (trigger.event.data.ts | float) | as_datetime | as_local }}
          {% elif this.state not in ['unknown', 'unavailable', 'None'] %}{{ this.state }}
          {% else %}None{% endif %}

  - triggers:
      - trigger: event
        event_type: dog_meal_logged
    sensor:
      - name: Dog last meal
        unique_id: dog_last_meal
        default_entity_id: sensor.dog_last_meal
        icon: mdi:food-drumstick
        device_class: timestamp
        state: "{{ (trigger.event.data.ts | float) | as_datetime | as_local }}"
        attributes:
          by: "{{ trigger.event.data.by | default('Someone') }}"

  # Awake hours (night excluded, custom_templates/dog.jinja) since the last pee / poop /
  # walk. Re-evaluated every minute (now()); the reminders trigger when they go above
  # the input_number limits.
  - sensor:
      - name: Dog awake hours since last pee
        unique_id: dog_awake_hours_since_last_pee
        default_entity_id: sensor.dog_awake_hours_since_last_pee
        icon: mdi:water-alert
        unit_of_measurement: h
        state: >
          {% from 'dog.jinja' import dog_awake_hours %}
          {{ dog_awake_hours(as_timestamp(states('sensor.dog_last_pee'), 0)) | float if has_value('sensor.dog_last_pee') else none }}
      - name: Dog awake hours since last poop
        unique_id: dog_awake_hours_since_last_poop
        default_entity_id: sensor.dog_awake_hours_since_last_poop
        icon: mdi:emoticon-poop
        unit_of_measurement: h
        state: >
          {% from 'dog.jinja' import dog_awake_hours %}
          {{ dog_awake_hours(as_timestamp(states('sensor.dog_last_poop'), 0)) | float if has_value('sensor.dog_last_poop') else none }}
      - name: Dog awake hours since last walk
        unique_id: dog_awake_hours_since_last_walk
        default_entity_id: sensor.dog_awake_hours_since_last_walk
        icon: mdi:dog-side
        unit_of_measurement: h
        # 0 while out on a walk
        state: >
          {% from 'dog.jinja' import dog_awake_hours %}
          {% set ended = state_attr('input_datetime.dog_walk_ended_at', 'timestamp') | float(0) %}
          {{ 0 if is_state('input_boolean.dog_out', 'on') else (dog_awake_hours(ended) | float if ended > 0 else none) }}

  # Last nights (fed by "AUT-Dog night end"): state = hours slept last night; attribute
  # `nights` = the last 7 nights as [start_ts, end_ts], used by custom_templates/dog.jinja
  - triggers:
      - trigger: event
        event_type: dog_night_ended
    sensor:
      - name: Dog last night
        unique_id: dog_last_night
        default_entity_id: sensor.dog_last_night
        icon: mdi:sleep
        unit_of_measurement: h
        state: "{{ ((trigger.event.data.end | float(0) - trigger.event.data.start | float(0)) / 3600) | round(1) }}"
        attributes:
          started: "{{ trigger.event.data.start | float(0) | timestamp_local }}"
          ended: "{{ trigger.event.data.end | float(0) | timestamp_local }}"
          # What ended it: lights / left_home / dog_activity / fallback
          woke_by: "{{ trigger.event.data.woke_by }}"
          nights: >
            {{ ((this.attributes.nights | default([], true)) + [[trigger.event.data.start | float(0), trigger.event.data.end | float(0)]])[-7:] }}
