# input_number:
  # No `initial` (they keep the value set from the UI); the defaults are set once by
  # "AUT-Dog default settings"
  dog_walk_daily_goal_minutes:
    name: Dog walk daily goal
    icon: mdi:flag-checkered
    min: 0
    max: 300
    step: 5
    unit_of_measurement: min
    mode: box
  dog_walk_reminder_hours:
    name: Dog max hours without going out
    icon: mdi:timer-sand
    min: 1
    max: 8
    step: 0.5
    unit_of_measurement: h
    mode: box
  dog_pee_reminder_hours:
    name: Dog max hours without peeing
    icon: mdi:water-alert
    min: 0.5
    max: 12
    step: 0.5
    unit_of_measurement: h
    mode: box
  dog_poop_reminder_hours:
    name: Dog max hours without pooping
    icon: mdi:emoticon-poop
    min: 1
    max: 24
    step: 0.5
    unit_of_measurement: h
    mode: box
  # Puppies usually need to go out a while after eating
  dog_after_meal_walk_minutes:
    name: Dog walk reminder after meal
    icon: mdi:food-drumstick-off
    min: 5
    max: 120
    step: 5
    unit_of_measurement: min
    mode: box
