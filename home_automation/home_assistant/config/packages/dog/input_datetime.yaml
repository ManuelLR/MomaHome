# input_datetime:
  dog_walk_started_at:
    name: Dog walk started at
    icon: mdi:door-open
    has_date: true
    has_time: true
  # End of the last finished walk: used by the "long time without going out" reminder
  dog_walk_ended_at:
    name: Dog walk ended at
    icon: mdi:home-import-outline
    has_date: true
    has_time: true
  # Time-only helpers. No `initial` (they keep the value set from the UI); the defaults
  # are set once by "AUT-Dog default settings".
  dog_meal_morning:
    name: Dog breakfast
    icon: mdi:food-drumstick
    has_date: false
    has_time: true
  dog_meal_evening:
    name: Dog dinner
    icon: mdi:food-drumstick
    has_date: false
    has_time: true
  # Night (packages/dog README "Night"): detected from the nightstand lights; these are
  # the fallbacks when nothing is detected, and the earliest wake-up time (before it a
  # light turned on is a night interruption, not the wake-up).
  dog_quiet_start:
    name: Dog fallback bedtime
    icon: mdi:weather-night
    has_date: false
    has_time: true
  dog_quiet_end:
    name: Dog latest wake-up
    icon: mdi:weather-sunny
    has_date: false
    has_time: true
  dog_earliest_wake:
    name: Dog earliest wake-up
    icon: mdi:weather-sunset-up
    has_date: false
    has_time: true
  # Current / last night (input_boolean.dog_night)
  dog_night_started_at:
    name: Dog night started at
    icon: mdi:sleep
    has_date: true
    has_time: true
