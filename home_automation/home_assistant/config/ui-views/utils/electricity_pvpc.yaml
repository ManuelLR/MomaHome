type: custom:apexcharts-card
header:
  show: true
  title: Precio luz (PVPC)
  show_states: true
  colorize_states: true
# Brush below covers the last 72h plus the next 24h (so the two previous
# days are always included). The brush selection always sits at the end of
# the span, so the default 27h view is the last 3 hours plus the next 24;
# drag it to go back.
graph_span: 96h
span:
  end: hour
  offset: +24h
experimental:
  brush: true
  color_threshold: true
brush:
  selection_span: 27h
now:
  show: true
  label: Ahora
all_series_config:
  type: area
  curve: stepline
  stroke_width: 0
  opacity: 0.85
  extend_to: false
  unit: €/kWh
  float_precision: 3
series:
  # Past days come from the sensor's own recorded history (its state is the
  # price of the current hour).
  - entity: sensor.pvpc
    name: Anterior
    color: '#9e9e9e'
    # Area fill coloured by price level (no line, only the fill).
    color_threshold: &thresholds
      - value: 0
        color: '#2e7d32'
      - value: 0.10
        color: '#9ccc65'
      - value: 0.15
        color: '#fbc02d'
      - value: 0.20
        color: '#ef6c00'
      - value: 0.25
        color: '#c62828'
    show:
      in_brush: true
      in_header: false
      legend_value: false
    data_generator: |
      const day0 = new Date();
      day0.setHours(0, 0, 0, 0);
      const from = new Date(start);
      const history = await hass.callApi('GET',
        'history/period/' + from.toISOString() +
        '?filter_entity_id=' + entity.entity_id +
        '&end_time=' + day0.toISOString() +
        '&minimal_response&no_attributes');
      const points = (history[0] || [])
        .map((s) => [Math.max(new Date(s.last_changed).getTime(), from.getTime()), parseFloat(s.state)])
        .filter((p) => !isNaN(p[1]));
      // Close the last step at midnight.
      if (points.length) points.push([day0.getTime(), points[points.length - 1][1]]);
      // Start from 0 (1 ms earlier) so the colour gradient is scaled from 0,
      // like the y axis; otherwise the colours don't match the price levels.
      if (points.length) points.unshift([points[0][0] - 1, 0]);
      return points;
  # One series per day, so each day gets its own min/max.
  - entity: sensor.pvpc
    name: Hoy
    color: '#ff9800'
    color_threshold: *thresholds
    show:
      in_brush: true
      in_header: raw
      legend_value: false
    data_generator: |
      const day0 = new Date();
      day0.setHours(0, 0, 0, 0);
      const points = [];
      for (let h = 0; h < 24; h++) {
        const price = entity.attributes['price_' + String(h).padStart(2, '0') + 'h'];
        if (price === undefined || price === null) continue;
        points.push([day0.getTime() + h * 3600 * 1000, price]);
      }
      // Close the last step so 23h is drawn as a full hour.
      if (points.length) points.push([points[points.length - 1][0] + 3600 * 1000, points[points.length - 1][1]]);
      // Start from 0 (1 ms earlier) so the colour gradient is scaled from 0,
      // like the y axis; otherwise the colours don't match the price levels.
      if (points.length) points.unshift([points[0][0] - 1, 0]);
      return points;
  - entity: sensor.pvpc
    name: Mañana
    color: '#2196f3'
    color_threshold: *thresholds
    show:
      in_brush: true
      in_header: false
      legend_value: false
    data_generator: |
      const day0 = new Date();
      day0.setHours(0, 0, 0, 0);
      day0.setDate(day0.getDate() + 1);
      const points = [];
      for (let h = 0; h < 24; h++) {
        const price = entity.attributes['price_next_day_' + String(h).padStart(2, '0') + 'h'];
        if (price === undefined || price === null) continue;
        points.push([day0.getTime() + h * 3600 * 1000, price]);
      }
      // Close the last step so 23h is drawn as a full hour.
      if (points.length) points.push([points[points.length - 1][0] + 3600 * 1000, points[points.length - 1][1]]);
      // Start from 0 (1 ms earlier) so the colour gradient is scaled from 0,
      // like the y axis; otherwise the colours don't match the price levels.
      if (points.length) points.unshift([points[0][0] - 1, 0]);
      return points;
  # Invisible series holding only each day's min/max, so the extremas
  # labels sit in the middle of the hour instead of at the step start.
  # Each day has a min series (green) and a max series (red) sharing the
  # same generator (YAML anchor).
  - entity: sensor.pvpc
    name: Anteayer mín
    color: '#43a047'
    type: line
    stroke_width: 0
    show:
      in_header: false
      in_legend: false
      legend_value: false
      extremas: min
    data_generator: &anteayer_extremas |
      const to = new Date();
      to.setHours(0, 0, 0, 0);
      to.setDate(to.getDate() - 1);
      const from = new Date(to);
      from.setDate(from.getDate() - 1);
      const history = await hass.callApi('GET',
        'history/period/' + from.toISOString() +
        '?filter_entity_id=' + entity.entity_id +
        '&end_time=' + to.toISOString() +
        '&minimal_response&no_attributes');
      const changes = (history[0] || [])
        .map((s) => [new Date(s.last_changed).getTime(), parseFloat(s.state)])
        .filter((p) => !isNaN(p[1]));
      // Rebuild the hourly prices (the state changes a few seconds after o'clock).
      const points = [];
      let i = 0;
      let value = null;
      for (let t = from.getTime(); t < to.getTime(); t += 3600 * 1000) {
        while (i < changes.length && changes[i][0] < t + 5 * 60 * 1000) value = changes[i++][1];
        if (value !== null) points.push([t, value]);
      }
      if (!points.length) return [];
      const min = points.reduce((a, b) => (b[1] < a[1] ? b : a));
      const max = points.reduce((a, b) => (b[1] > a[1] ? b : a));
      return [min, max]
        .map(([t, v]) => [t + 1800 * 1000, v])
        .sort((a, b) => a[0] - b[0]);
  - entity: sensor.pvpc
    name: Anteayer máx
    color: '#e53935'
    type: line
    stroke_width: 0
    show:
      in_header: false
      in_legend: false
      legend_value: false
      extremas: max
    data_generator: *anteayer_extremas
  - entity: sensor.pvpc
    name: Ayer mín
    color: '#43a047'
    type: line
    stroke_width: 0
    show:
      in_header: false
      in_legend: false
      legend_value: false
      extremas: min
    data_generator: &ayer_extremas |
      const to = new Date();
      to.setHours(0, 0, 0, 0);
      const from = new Date(to);
      from.setDate(from.getDate() - 1);
      const history = await hass.callApi('GET',
        'history/period/' + from.toISOString() +
        '?filter_entity_id=' + entity.entity_id +
        '&end_time=' + to.toISOString() +
        '&minimal_response&no_attributes');
      const changes = (history[0] || [])
        .map((s) => [new Date(s.last_changed).getTime(), parseFloat(s.state)])
        .filter((p) => !isNaN(p[1]));
      // Rebuild the hourly prices (the state changes a few seconds after o'clock).
      const points = [];
      let i = 0;
      let value = null;
      for (let t = from.getTime(); t < to.getTime(); t += 3600 * 1000) {
        while (i < changes.length && changes[i][0] < t + 5 * 60 * 1000) value = changes[i++][1];
        if (value !== null) points.push([t, value]);
      }
      if (!points.length) return [];
      const min = points.reduce((a, b) => (b[1] < a[1] ? b : a));
      const max = points.reduce((a, b) => (b[1] > a[1] ? b : a));
      return [min, max]
        .map(([t, v]) => [t + 1800 * 1000, v])
        .sort((a, b) => a[0] - b[0]);
  - entity: sensor.pvpc
    name: Ayer máx
    color: '#e53935'
    type: line
    stroke_width: 0
    show:
      in_header: false
      in_legend: false
      legend_value: false
      extremas: max
    data_generator: *ayer_extremas
  - entity: sensor.pvpc
    name: Hoy mín
    color: '#43a047'
    type: line
    stroke_width: 0
    show:
      in_header: false
      in_legend: false
      legend_value: false
      extremas: min
    data_generator: &hoy_extremas |
      const day0 = new Date();
      day0.setHours(0, 0, 0, 0);
      const points = [];
      for (let h = 0; h < 24; h++) {
        const price = entity.attributes['price_' + String(h).padStart(2, '0') + 'h'];
        if (price === undefined || price === null) continue;
        points.push([day0.getTime() + h * 3600 * 1000, price]);
      }
      if (!points.length) return [];
      // Only min and max, placed at the middle of their hour.
      const min = points.reduce((a, b) => (b[1] < a[1] ? b : a));
      const max = points.reduce((a, b) => (b[1] > a[1] ? b : a));
      return [min, max]
        .map(([t, v]) => [t + 1800 * 1000, v])
        .sort((a, b) => a[0] - b[0]);
  - entity: sensor.pvpc
    name: Hoy máx
    color: '#e53935'
    type: line
    stroke_width: 0
    show:
      in_header: false
      in_legend: false
      legend_value: false
      extremas: max
    data_generator: *hoy_extremas
  - entity: sensor.pvpc
    name: Mañana mín
    color: '#43a047'
    type: line
    stroke_width: 0
    show:
      in_header: false
      in_legend: false
      legend_value: false
      extremas: min
    data_generator: &manana_extremas |
      const day0 = new Date();
      day0.setHours(0, 0, 0, 0);
      day0.setDate(day0.getDate() + 1);
      const points = [];
      for (let h = 0; h < 24; h++) {
        const price = entity.attributes['price_next_day_' + String(h).padStart(2, '0') + 'h'];
        if (price === undefined || price === null) continue;
        points.push([day0.getTime() + h * 3600 * 1000, price]);
      }
      if (!points.length) return [];
      // Only min and max, placed at the middle of their hour.
      const min = points.reduce((a, b) => (b[1] < a[1] ? b : a));
      const max = points.reduce((a, b) => (b[1] > a[1] ? b : a));
      return [min, max]
        .map(([t, v]) => [t + 1800 * 1000, v])
        .sort((a, b) => a[0] - b[0]);
  - entity: sensor.pvpc
    name: Mañana máx
    color: '#e53935'
    type: line
    stroke_width: 0
    show:
      in_header: false
      in_legend: false
      legend_value: false
      extremas: max
    data_generator: *manana_extremas
yaxis:
  - min: 0
    decimals: 2
    apex_config:
      tickAmount: 5
apex_config:
  legend:
    show: false
  xaxis:
    labels:
      datetimeUTC: false
      datetimeFormatter:
        day: ddd dd
        hour: 'HH:mm'
  tooltip:
    enabledOnSeries: [0, 1, 2]
    x:
      format: ddd dd, HH:mm
