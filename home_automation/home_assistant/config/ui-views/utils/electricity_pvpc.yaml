type: custom:apexcharts-card
header:
  show: true
  title: Precio luz (PVPC)
  show_states: true
  colorize_states: true
# Brush shows the whole range below; the main chart shows a 12h window.
# The brush selection always starts at the end of the span, so the span ends
# 12h from now: by default you see the next 12 hours and can drag back.
graph_span: 36h
span:
  end: hour
  offset: +12h
experimental:
  brush: true
brush:
  selection_span: 12h
now:
  show: true
  label: Ahora
all_series_config:
  type: area
  curve: stepline
  stroke_width: 2
  opacity: 0.25
  extend_to: false
  unit: €/kWh
  float_precision: 3
series:
  # One series per day, so each day gets its own min/max.
  - entity: sensor.pvpc
    name: Hoy
    color: '#ff9800'
    show:
      in_header: raw
      in_brush: true
      legend_value: false
    data_generator: |
      const day0 = new Date();
      day0.setHours(0, 0, 0, 0);
      const points = [];
      for (let h = 0; h < 24; h++) {
        const price = entity.attributes['price_' + String(h).padStart(2, '0') + 'h'];
        if (price === undefined || price === null) continue;
        points.push([day0.getTime() + h * 3600 * 1000, price]);
      }
      // Close the last step so 23h is drawn as a full hour.
      if (points.length) points.push([points[points.length - 1][0] + 3600 * 1000, points[points.length - 1][1]]);
      return points;
  - entity: sensor.pvpc
    name: Mañana
    color: '#2196f3'
    show:
      in_header: false
      in_brush: true
      legend_value: false
    data_generator: |
      const day0 = new Date();
      day0.setHours(0, 0, 0, 0);
      day0.setDate(day0.getDate() + 1);
      const points = [];
      for (let h = 0; h < 24; h++) {
        const price = entity.attributes['price_next_day_' + String(h).padStart(2, '0') + 'h'];
        if (price === undefined || price === null) continue;
        points.push([day0.getTime() + h * 3600 * 1000, price]);
      }
      // Close the last step so 23h is drawn as a full hour.
      if (points.length) points.push([points[points.length - 1][0] + 3600 * 1000, points[points.length - 1][1]]);
      return points;
  # Invisible series holding only each day's min/max, so the extremas
  # labels sit in the middle of the hour instead of at the step start.
  - entity: sensor.pvpc
    name: Hoy
    color: '#ff9800'
    type: line
    stroke_width: 0
    show:
      in_header: false
      in_brush: false
      in_legend: false
      legend_value: false
      extremas: true
    data_generator: |
      const day0 = new Date();
      day0.setHours(0, 0, 0, 0);
      const points = [];
      for (let h = 0; h < 24; h++) {
        const price = entity.attributes['price_' + String(h).padStart(2, '0') + 'h'];
        if (price === undefined || price === null) continue;
        points.push([day0.getTime() + h * 3600 * 1000, price]);
      }
      if (!points.length) return [];
      // Only min and max, placed at the middle of their hour.
      const min = points.reduce((a, b) => (b[1] < a[1] ? b : a));
      const max = points.reduce((a, b) => (b[1] > a[1] ? b : a));
      return [min, max]
        .map(([t, v]) => [t + 1800 * 1000, v])
        .sort((a, b) => a[0] - b[0]);
  - entity: sensor.pvpc
    name: Mañana
    color: '#2196f3'
    type: line
    stroke_width: 0
    show:
      in_header: false
      in_brush: false
      in_legend: false
      legend_value: false
      extremas: true
    data_generator: |
      const day0 = new Date();
      day0.setHours(0, 0, 0, 0);
      day0.setDate(day0.getDate() + 1);
      const points = [];
      for (let h = 0; h < 24; h++) {
        const price = entity.attributes['price_next_day_' + String(h).padStart(2, '0') + 'h'];
        if (price === undefined || price === null) continue;
        points.push([day0.getTime() + h * 3600 * 1000, price]);
      }
      if (!points.length) return [];
      // Only min and max, placed at the middle of their hour.
      const min = points.reduce((a, b) => (b[1] < a[1] ? b : a));
      const max = points.reduce((a, b) => (b[1] > a[1] ? b : a));
      return [min, max]
        .map(([t, v]) => [t + 1800 * 1000, v])
        .sort((a, b) => a[0] - b[0]);
yaxis:
  - min: 0
    decimals: 2
    apex_config:
      tickAmount: 5
apex_config:
  legend:
    show: false
  xaxis:
    labels:
      datetimeUTC: false
      datetimeFormatter:
        day: ddd dd
        hour: 'HH:mm'
  tooltip:
    enabledOnSeries: [0, 1]
    x:
      format: ddd dd, HH:mm
