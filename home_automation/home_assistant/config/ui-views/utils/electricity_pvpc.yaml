type: custom:apexcharts-card
header:
  show: true
  title: Precio luz (PVPC)
  show_states: true
  colorize_states: true
graph_span: 48h
span:
  start: day
now:
  show: true
  label: Ahora
all_series_config:
  type: area
  curve: stepline
  stroke_width: 2
  opacity: 0.25
  extend_to: false
  unit: €/kWh
  float_precision: 3
series:
  # Each day is its own series so min/max (extremas) are computed per day.
  - entity: sensor.pvpc
    name: Hoy
    color: '#ff9800'
    show:
      in_header: raw
      legend_value: false
      extremas: true
    data_generator: |
      const day0 = new Date();
      day0.setHours(0, 0, 0, 0);
      const points = [];
      for (let h = 0; h < 24; h++) {
        const price = entity.attributes['price_' + String(h).padStart(2, '0') + 'h'];
        if (price === undefined || price === null) continue;
        points.push([day0.getTime() + h * 3600 * 1000, price]);
      }
      // Close the last step so 23h is drawn as a full hour.
      if (points.length) points.push([points[points.length - 1][0] + 3600 * 1000, points[points.length - 1][1]]);
      return points;
  - entity: sensor.pvpc
    name: Mañana
    color: '#2196f3'
    show:
      in_header: false
      legend_value: false
      extremas: true
    data_generator: |
      const day0 = new Date();
      day0.setHours(0, 0, 0, 0);
      day0.setDate(day0.getDate() + 1);
      const points = [];
      for (let h = 0; h < 24; h++) {
        const price = entity.attributes['price_next_day_' + String(h).padStart(2, '0') + 'h'];
        if (price === undefined || price === null) continue;
        points.push([day0.getTime() + h * 3600 * 1000, price]);
      }
      if (points.length) points.push([points[points.length - 1][0] + 3600 * 1000, points[points.length - 1][1]]);
      return points;
yaxis:
  - min: 0
    decimals: 2
    apex_config:
      tickAmount: 5
apex_config:
  legend:
    show: false
  xaxis:
    labels:
      datetimeUTC: false
      datetimeFormatter:
        day: ddd dd
        hour: 'HH:mm'
  tooltip:
    x:
      format: ddd dd, HH:mm
