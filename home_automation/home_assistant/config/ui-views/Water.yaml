# NOTE: entity IDs follow the confirmed pattern sensor.emasesa_consumo_medio_diario.
# Adjust them if your installation generates different IDs (depends on the HA device name).

- type: vertical-stack
  cards:
    # ── Quick summary ────────────────────────────────────────────────────────
    - type: horizontal-stack
      cards:
        - type: custom:mushroom-entity-card
          entity: sensor.emasesa_consumo_del_dia
          name: Today's consumption
          icon: mdi:water
          primary_info: state
          secondary_info: last-updated
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.emasesa_consumo_medio_diario
          name: Daily average
          icon: mdi:chart-line
          primary_info: state
          secondary_info: attribute
          attribute: valoracion_texto
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.emasesa_coste_del_periodo
          name: Period cost
          icon: mdi:cash
          primary_info: state
          secondary_info: attribute
          attribute: periodo_desde
          tap_action:
            action: more-info

    # ── Billing ──────────────────────────────────────────────────────────────
    - type: horizontal-stack
      cards:
        - type: entity
          entity: sensor.emasesa_ultima_factura
          name: Last invoice
        - type: entity
          entity: sensor.emasesa_importe_pendiente
          name: Outstanding amount
        - type: entity
          entity: sensor.emasesa_dias_para_la_proxima_factura
          name: Next invoice in

    # ── Daily consumption — last 30 days ─────────────────────────────────────
    - type: custom:mini-graph-card
      name: Daily consumption (30 days)
      entities:
        - entity: sensor.emasesa_consumo_del_dia
          name: Litres
      hours_to_show: 720
      group_by: date
      aggregate_func: max
      line_color: '#2196F3'
      bar_chart: true
      show:
        extrema: true
        legend: false
        state: true

    # ── Weekly accumulated consumption (HA statistics) ───────────────────────
    - type: statistics-graph
      title: Weekly consumption (m³)
      entities:
        - entity: sensor.emasesa_indice_del_contador
          name: Meter
      days_to_show: 90
      period: week
      stat_types:
        - change

    # ── Rivers (SAIH Guadalquivir, packages/saih_guadalquivir) ───────────────
    - type: entities
      title: Rivers
      entities:
        - entity: sensor.saih_worst_river_alert
          name: Worst alert
        - type: section
          label: Guadaíra (home → upstream)
        - entity: sensor.saih_a55_guadaira_sevilla
          name: Sevilla (home)
        - entity: sensor.saih_a19_guadaira_alcala
          name: Alcalá de Guadaíra
        - entity: sensor.saih_m54_guadaira_alcala_2
          name: Alcalá de Guadaíra 2
        - entity: sensor.saih_m07_guadaira_arahal
          name: Arahal
        - type: section
          label: Guadalquivir (Sevilla / La Algaba)
        - entity: sensor.saih_m09_guadalquivir_sevilla
          name: Sevilla (m a.s.l.)
        - entity: sensor.saih_h09_alcala_del_rio_dam
          name: Alcalá del Río dam
        - entity: sensor.saih_h08_cantillana_dam
          name: Cantillana dam
        - entity: sensor.saih_a33_rivera_de_huelva_guillena
          name: Rivera de Huelva (Guillena)
    - type: history-graph
      title: Guadaíra level (48 h)
      hours_to_show: 48
      entities:
        - entity: sensor.saih_a55_guadaira_sevilla
          name: Sevilla
        - entity: sensor.saih_a19_guadaira_alcala
          name: Alcalá
        - entity: sensor.saih_m07_guadaira_arahal
          name: Arahal

    # ── Reservoirs ───────────────────────────────────────────────────────────
    - type: entities
      title: Sevilla supply reservoirs (SAIH, real time)
      entities:
        - entity: sensor.saih_e61_aracena
          name: Aracena
        - entity: sensor.saih_e62_zufre
          name: Zufre
        - entity: sensor.saih_e63_la_minilla
          name: La Minilla
        - entity: sensor.saih_e65_el_gergal
          name: El Gergal
        - entity: sensor.saih_e64_cala
          name: Cala
        - entity: sensor.saih_e58_melonares
          name: Melonares
    - type: history-graph
      title: Reservoir releases (7 days)
      hours_to_show: 168
      entities:
        - entity: sensor.saih_e61_aracena_release
          name: Aracena
        - entity: sensor.saih_e62_zufre_release
          name: Zufre
        - entity: sensor.saih_e63_la_minilla_release
          name: La Minilla
        - entity: sensor.saih_e65_el_gergal_release
          name: El Gergal
        - entity: sensor.saih_e64_cala_release
          name: Cala
        - entity: sensor.saih_e58_melonares_release
          name: Melonares
    - type: entity
      entity: sensor.emasesa_embalses
      name: Reservoir level (Seville)
      icon: mdi:waves
    - type: custom:mini-graph-card
      name: Reservoir level history
      entities:
        - entity: sensor.emasesa_embalses
          name: Level (%)
      hours_to_show: 8760
      group_by: week
      aggregate_func: last
      line_color: '#03A9F4'
      show:
        extrema: true
        fill: true

    # ── Alerts / status ──────────────────────────────────────────────────────
    - type: entities
      title: Status & alerts
      entities:
        - entity: binary_sensor.emasesa_posible_fuga
          name: Possible leak
          icon: mdi:water-alert
        - entity: binary_sensor.emasesa_incidencia_de_red_cercana
          name: Nearby network incident
          icon: mdi:pipe-leak
        - entity: binary_sensor.emasesa_averia_del_contador
          name: Meter fault
          icon: mdi:counter
        - entity: binary_sensor.emasesa_incidencia_pendiente
          name: Pending incident
          icon: mdi:wrench-clock
        - entity: sensor.emasesa_precio_del_agua
          name: Water price (€/m³)
          icon: mdi:cash-multiple
