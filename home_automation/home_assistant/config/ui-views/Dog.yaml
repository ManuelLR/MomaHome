# Dog walks diary (packages/dog)
- type: conditional
  conditions:
    - entity: input_boolean.dog_out
      state: 'off'
  card:
    type: grid
    title: 🐶 At home
    columns: 4
    square: false
    cards:
      - type: button
        name: Going out now
        icon: mdi:dog-side
        tap_action:
          action: perform-action
          perform_action: script.dog_walk_start_now
      - type: button
        name: Fed now
        icon: mdi:food-drumstick
        tap_action:
          action: perform-action
          perform_action: script.dog_log_meal
          confirmation:
            text: Mark the dog as fed now?
      - type: button
        name: Pee at home
        icon: mdi:water-alert
        tap_action:
          action: perform-action
          perform_action: script.dog_log_accident
          data:
            kind: pee
          confirmation:
            text: Log a pee at home?
      - type: button
        name: Poop at home
        icon: mdi:emoticon-poop
        tap_action:
          action: perform-action
          perform_action: script.dog_log_accident
          data:
            kind: poop
          confirmation:
            text: Log a poop at home?
- type: conditional
  conditions:
    - entity: input_boolean.dog_out
      state: 'on'
  card:
    type: vertical-stack
    cards:
      - type: entities
        title: 🚶 Out on a walk
        entities:
          - entity: input_select.dog_walker
            name: With
          - entity: input_datetime.dog_walk_started_at
            name: Since
      - type: grid
        columns: 4
        square: false
        cards:
          - &dog_back_button
            type: button
            name: 💧 Pee
            show_icon: false
            tap_action:
              action: perform-action
              perform_action: script.dog_walk_end_now
              data:
                pee: true
                poop: false
          - <<: *dog_back_button
            name: 💩 Poop
            tap_action:
              action: perform-action
              perform_action: script.dog_walk_end_now
              data:
                pee: false
                poop: true
          - <<: *dog_back_button
            name: 💧💩 Both
            tap_action:
              action: perform-action
              perform_action: script.dog_walk_end_now
              data:
                pee: true
                poop: true
          - <<: *dog_back_button
            name: 🚫 Nothing
            tap_action:
              action: perform-action
              perform_action: script.dog_walk_end_now
              data:
                pee: false
                poop: false

- type: glance
  title: Today
  columns: 4
  entities:
    - entity: sensor.dog_walk_minutes_today
      name: Walked
    - entity: sensor.dog_walks_today
      name: Walks
    - entity: sensor.dog_pees_today
      name: Pees
    - entity: sensor.dog_poops_today
      name: Poops
    - entity: sensor.dog_accidents_today
      name: At home
    - entity: sensor.dog_last_pee
      name: Last pee
      format: relative
    - entity: sensor.dog_last_poop
      name: Last poop
      format: relative
    - entity: input_datetime.dog_walk_ended_at
      name: Last walk
    - entity: sensor.dog_meals_today
      name: Meals
    - entity: sensor.dog_last_meal
      name: Last meal
      format: relative
    - entity: sensor.dog_awake_hours_since_last_pee
      name: No pee (awake)
    - entity: sensor.dog_awake_hours_since_last_poop
      name: No poop (awake)

# "Screen time", dog version: one bar per day
- type: statistics-graph
  title: Minutes walked per day
  chart_type: bar
  period: day
  days_to_show: 30
  stat_types:
    - max
  entities:
    - entity: sensor.dog_walk_minutes_today
      name: Minutes
- type: statistics-graph
  title: Pees / poops per day
  chart_type: line
  period: day
  days_to_show: 30
  stat_types:
    - max
  entities:
    - entity: sensor.dog_pees_today
      name: Pees
    - entity: sensor.dog_poops_today
      name: Poops
    - entity: sensor.dog_accidents_today
      name: At home

# When does it go out? (open the Calendar panel → week view for the exact times)
- type: history-graph
  title: Walks (last 7 days)
  hours_to_show: 168
  entities:
    - entity: input_boolean.dog_out
      name: Out

- type: calendar
  title: Diary
  initial_view: listWeek
  entities:
    - calendar.dog_log

- type: entities
  title: Settings
  entities:
    - input_number.dog_walk_daily_goal_minutes
    - input_number.dog_walk_reminder_hours
    - input_number.dog_pee_reminder_hours
    - input_number.dog_poop_reminder_hours
    - input_datetime.dog_meal_morning
    - input_datetime.dog_meal_evening
    - input_number.dog_after_meal_walk_minutes
    - type: section
      label: Night (no reminders, not counted)
    - input_datetime.dog_quiet_start
    - input_datetime.dog_quiet_end
