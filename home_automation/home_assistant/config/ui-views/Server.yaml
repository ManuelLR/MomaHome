- type: entities
  title: 'Server stats (Netdata)'
  entities:
    - sensor.server_cpu_usage
    - sensor.server_ram_used
    - sensor.server_load_1min
    - sensor.server_disk_used
    - sensor.server_disk_available

- type: history-graph
  title: 'Server'
  hours_to_show: 5
  entities:
    - sensor.server_cpu_usage
    - sensor.server_ram_used
    - sensor.server_load_1min

- type: entities
  title: 'CrowdSec'
  entities:
    - sensor.crowdsec_targeted_bans_today
    - sensor.crowdsec_bans_today
    - entity: sensor.crowdsec_last_targeted_ban
      secondary_info: last-changed
    - entity: sensor.crowdsec_last_ban
      secondary_info: last-changed
    - type: attribute
      entity: sensor.crowdsec_last_ban
      attribute: ip
      name: 'Last banned IP'
    - type: attribute
      entity: sensor.crowdsec_last_ban
      attribute: country
      name: 'Country'

- type: markdown
  content: >-
    {% set ui = state_attr('sensor.crowdsec_last_ban', 'ui_url') %}
    {% set t_ip = state_attr('sensor.crowdsec_last_targeted_ban', 'ip') %}
    {% set ip = state_attr('sensor.crowdsec_last_ban', 'ip') %}
    {% if ui %}
    [CrowdSec UI]({{ ui }})
    {%- if t_ip %} · [Last targeted ban]({{ ui }}/decisions?q={{ ('ip="' ~ t_ip ~ '"') | urlencode }}){% endif %}
    {%- if ip %} · [Last ban]({{ ui }}/decisions?q={{ ('ip="' ~ ip ~ '"') | urlencode }}){% endif %}
    {% else %}
    CrowdSec UI link appears after the next ban (or midnight).
    {% endif %}

- type: history-graph
  title: 'CrowdSec bans'
  hours_to_show: 168
  entities:
    - sensor.crowdsec_targeted_bans_today
    - sensor.crowdsec_bans_today

- type: entities
  title: 'UPS Server'
  entities:
    - sensor.ups_battery
    - sensor.ups_load
    - binary_sensor.ups_online_status
    - sensor.ups_startup_time
    - sensor.ups_status
    - sensor.ups_status_flag
    - sensor.ups_time_left
    - sensor.ups_time_on_battery
    - sensor.ups_total_time_on_battery
    - sensor.ups_transfer_from_battery

