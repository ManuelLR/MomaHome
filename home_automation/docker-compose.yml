version: "2.4"
services:
    home-assistant:
        # container_name: home-assistant
        hostname: woody-docker_home-assistant
        build:
            context: home_assistant/
        depends_on:
          - postgres
        # ports:
        #     - 0.0.0.0:8123:8123
        volumes:
            # Config files
            - ./home_assistant/config/:/config/
            - ./home_assistant/HA-custom-www/my-config/:/HA-custom-www/my-config/
            # /run/dbus was mounted here to reach BlueZ on the host. The local
            # adapter is gone: BLE goes through the bluetooth_proxy on
            # man-005--esphome over the network.
        devices:
            # Zigbee dongle
            - /dev/ttyUSB0:/dev/ttyUSB0
        environment:
            - TZ="Europe/Madrid"
                # Reduce logging verbosity caused by ddwrt recurrent requests
            - PYTHONWARNINGS=ignore:Unverified HTTPS request is being made to host '192.168.200.1'
        restart: unless-stopped
        stop_grace_period: 5m
        security_opt:
            # Blocks privilege gain through setuid/file-capability binaries.
            # Safe here: the container runs as plain root (no userns-remap, no
            # PUID/PGID), so s6-overlay never needs to gain anything, and
            # prepare.sh only shells out to hass. Marginal on its own though:
            # see the note on network_mode below for where the real exposure is.
            - "no-new-privileges:true"
        # Needed for network discovery (mDNS/SSDP): ESPHome, Cast, upnp,
        # nmap_tracker. Nothing to do with bluetooth, despite the old comment.
        network_mode: "host"
        labels:
            - "traefik.enable=true"
            - "traefik.http.services.home-assistant.loadbalancer.server.port=8123"
            - "traefik.http.routers.home-assistant.rule=Host(`${EXTERNAL_DOMAIN}`)"
            - "traefik.http.routers.home-assistant.entrypoints=websecure"
            - "traefik.http.routers.home-assistant.tls.certresolver=principal"
            - "traefik.http.routers.home-assistant.tls.domains[0].sans=${EXTERNAL_WILDCARD_DOMAIN}"

    esphome:
        image: esphome/esphome:2026.7.2
        restart: unless-stopped
        # ports:
        #     - 0.0.0.0:6052:6052
        ## Required to be able to auto-discover devices in the network
        network_mode: "host"
        volumes:
            - ./esphome/:/config:rw
            # Use local time for logging timestamps
            - /etc/localtime:/etc/localtime:ro
        environment:
            - ESPHOME_USERNAME=${ESPHOME_DASHBOARD_USERNAME}
            - ESPHOME_PASSWORD=${ESPHOME_DASHBOARD_PASSWORD}


    postgres:
        image: postgres:14-alpine
        restart: unless-stopped
        ports:
            - 127.0.0.1:5432:5432
            # - 0.0.0.0:5432:5432
        stop_grace_period: 5m
        volumes:
          # Must be declared as external volume
            - ./postgres-data:/var/lib/postgresql/data
        environment:
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

    mqtt:
        image: eclipse-mosquitto:2.0.18
        restart: unless-stopped
        ports:
            - 1883:1883
        volumes:
            - ./mosquitto-config/:/mosquitto/config/:ro

